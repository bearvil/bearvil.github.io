 chave é enviada para autenticação.</p>\n<h3>3.3 Entrada de voz (reconhecimento de fala)</h3>\n<p>Quando você usa o microfone, a conversão de fala em texto é realizada pelo\n<strong>serviço de fala do sistema do seu dispositivo</strong> — Apple (SFSpeechRecognizer)\nno iOS, o reconhecimento de fala do Google no Android ou o mecanismo de fala\ndo seu navegador na web. Dependendo do dispositivo e do idioma, <strong>o áudio\npode ser processado nos servidores da Apple ou do Google</strong> conforme as\npolíticas de privacidade deles. O aplicativo em si <strong>não grava nem armazena\náudio</strong> — ele apenas recebe o texto resultante, que permanece no campo de\nmensagem até que você decida enviá-lo.</p>\n<h3>3.4 Denúncia de conteúdo de IA</h3>\n<p>Você pode denunciar conteúdo de IA ofensivo ou impreciso diretamente de uma\nconversa (ícone de bandeira ao lado de uma mensagem do assistente). Isso abre\no <strong>cliente de e-mail do seu dispositivo</strong> com uma mensagem pré-preenchida\npara <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong>, contendo o motivo selecionado e um trecho da\nmensagem denunciada (até 500 caracteres). Nada é enviado até que você mesmo\nenvie o e-mail — o aplicativo não se comunica com nenhuma API de denúncia.</p>\n<h3>3.5 Links de doação externos</h3>\n<p>A tela &quot;Apoiar o desenvolvimento&quot; contém links opcionais para <strong>Ko-fi</strong> e\n<strong>Buy Me a Coffee</strong>. Tocar neles abre o site externo no seu navegador;\nqualquer pagamento acontece inteiramente nesses sites de terceiros, conforme\nas políticas de privacidade deles. O aplicativo em si não processa pagamentos\ne não recebe nenhum dado sobre eles.</p>\n<h3>3.6 O que o aplicativo <strong>NÃO</strong> envia</h3>\n<ul>\n<li>Telemetria (analytics)</li>\n<li>Relatórios de falhas (sem Sentry, Crashlytics, Bugsnag…)</li>\n<li>Notificações push (o aplicativo não as utiliza)</li>\n<li>Localização</li>\n<li>Contatos, calendário, fotos sem sua seleção explícita</li>\n<li>Conversas para qualquer servidor que não seja o provedor escolhido</li>\n</ul>\n<hr>\n<h2>4. Permissões do dispositivo</h2>\n<p>O aplicativo solicitará <strong>permissões explícitas</strong> no momento do uso para:</p>\n<table>\n<thead>\n<tr>\n<th>Permissão</th>\n<th>Quando solicitada</th>\n<th>Por quê</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Biblioteca de fotos</strong></td>\n<td>Somente quando você toca em &quot;Galeria&quot; para um anexo</td>\n<td>Para selecionar uma imagem</td>\n</tr>\n<tr>\n<td><strong>Câmera</strong></td>\n<td>Somente quando você toca em &quot;Foto&quot; para um anexo</td>\n<td>Para tirar uma foto</td>\n</tr>\n<tr>\n<td><strong>Microfone</strong></td>\n<td>Somente quando você toca no ícone de microfone pela primeira vez</td>\n<td>Entrada de voz (veja 3.3 — processada pelo serviço de fala do sistema)</td>\n</tr>\n<tr>\n<td><strong>Internet</strong></td>\n<td>Implícita</td>\n<td>Envio para os provedores</td>\n</tr>\n</tbody></table>\n<p>O diálogo do sistema iOS / Android é granular — você pode recusar e o\naplicativo continua funcionando (apenas sem aquela funcionalidade).</p>\n<hr>\n<h2>5. Transparência de IA</h2>\n<p>Na primeira inicialização, o aplicativo exibe um aviso claro de que <strong>você\nestá conversando com uma inteligência artificial</strong>, em conformidade com os\nrequisitos de transparência do EU AI Act. Respostas geradas por IA podem ser\nimprecisas (&quot;alucinações&quot;) — verifique informações importantes de forma\nindependente. Sua confirmação desse aviso é armazenada apenas localmente no\nseu dispositivo.</p>\n<hr>\n<h2>6. Seus direitos (RGPD)</h2>\n<p>Embora o aplicativo <strong>não mantenha dados na nuvem</strong>, estes são seus direitos\nao abrigo do Regulamento Geral sobre a Proteção de Dados (RGPD):</p>\n<ul>\n<li><strong>Direito de acesso</strong> — tudo o que o aplicativo guarda está no sandbox do\nseu dispositivo e visível na interface (conversas, chaves, configurações).</li>\n<li><strong>Direito de retificação</strong> — todas as entradas podem ser alteradas em\nConfigurações.</li>\n<li><strong>Direito de apagamento</strong> — use &quot;Excluir todas as conversas&quot; em\nConfigurações e exclua as chaves individualmente. Desinstalar o aplicativo\napaga tudo.</li>\n<li><strong>Direito de limitação do tratamento</strong> — desative o envio excluindo a chave;\nsem uma chave o aplicativo não envia nada.</li>\n<li><strong>Direito à portabilidade dos dados</strong> — a exportação não está implementada\nainda. Alternativa: pressione e segure uma mensagem → Copiar.\n(Exportação em massa é planejada para futuras versões.)</li>\n<li><strong>Direito de oposição</strong> — entre em contato conosco (veja abaixo).</li>\n<li><strong>Direito de retirar o consentimento</strong> — todas as permissões podem ser\nrevogadas nas configurações do sistema do dispositivo.</li>\n</ul>\n<p>Para reclamações, você pode contatar a autoridade de proteção de dados (APD)\ncompetente do seu país.</p>\n<hr>\n<h2>7. Crianças</h2>\n<p>O aplicativo não se destina a crianças menores de 13 anos. Os modelos de IA\npodem gerar conteúdo inadequado para crianças (os provedores têm seus próprios\ncontroles, mas não são perfeitos). Os pais são responsáveis por supervisionar\no uso.</p>\n<hr>\n<h2>8. Alterações na política</h2>\n<p>A política pode mudar com uma nova versão do aplicativo. Em caso de\nalterações significativas (por ex. adição de um novo serviço de terceiros),\nmudaremos a data &quot;Vigente a partir de&quot; no topo e indicaremos o motivo nas\nnotas de lançamento da nova versão.</p>\n<p>Esta política está disponível em vários idiomas no aplicativo; em caso de\ndivergências, <strong>prevalece a versão em inglês</strong>.</p>\n<hr>\n<h2>Contato</h2>\n<p>Para qualquer dúvida sobre esta política:</p>\n<ul>\n<li>E-mail: <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong></li>\n<li>GitHub issue: consulte o repositório</li>\n</ul>\n","ru":"<h1>Политика конфиденциальности — Frend AI</h1>\n<p>Эта политика описывает, <strong>какие данные обрабатываются</strong> при использовании\nприложения Frend AI (мобильная и веб-версии). Приложение построено на\nпринципе <strong>конфиденциальности по умолчанию</strong> — без собственного бэкенда,\nбез регистрации, без телеметрии.</p>\n<hr>\n<h2>1. Краткое резюме</h2>\n<table>\n<thead>\n<tr>\n<th>Вопрос</th>\n<th>Ответ</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Чьи это данные?</td>\n<td><strong>Твои.</strong> Всё остаётся на твоём устройстве.</td>\n</tr>\n<tr>\n<td>Отправляешь ли ты их куда-либо?</td>\n<td>Только <strong>напрямую провайдерам, ключи которых ты ввёл</strong> (OpenAI, Anthropic, …).</td>\n</tr>\n<tr>\n<td>Есть ли у вас бэкенд?</td>\n<td><strong>Нет.</strong></td>\n</tr>\n<tr>\n<td>Есть ли у вас аналитика?</td>\n<td><strong>Нет.</strong></td>\n</tr>\n<tr>\n<td>Есть ли у вас сборщик сбоев?</td>\n<td><strong>Нет.</strong></td>\n</tr>\n<tr>\n<td>Реклама или покупки в приложении?</td>\n<td><strong>Нет.</strong> Приложение без рекламы и без покупок в приложении. Поддержать разработку можно через опциональные внешние ссылки для пожертвований (Ko-fi, Buy Me a Coffee).</td>\n</tr>\n<tr>\n<td>Могу ли я удалить свои данные?</td>\n<td>Да, одним касанием в Настройках.</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>2. Что приложение хранит локально (на твоём устройстве)</h2>\n<table>\n<thead>\n<tr>\n<th>Данные</th>\n<th>Где</th>\n<th>Зачем</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>API-ключи провайдеров</td>\n<td>iOS Keychain / Android Keystore (мобильные), localStorage (веб)</td>\n<td>Нужны для отправки запросов провайдерам</td>\n</tr>\n<tr>\n<td>Переписки (чаты)</td>\n<td>AsyncStorage в песочнице приложения</td>\n<td>История, поиск, закреплённые чаты</td>\n</tr>\n<tr>\n<td>Вложения (изображения, PDF, аудио)</td>\n<td>Каталог документов приложения</td>\n<td>Чтобы данные сохранялись после перезагрузки/переустановки (до удаления приложения)</td>\n</tr>\n<tr>\n<td>Настройки</td>\n<td>AsyncStorage</td>\n<td>Модель по умолчанию, тема, язык приложения, имя, системный промпт, горячие клавиши</td>\n</tr>\n<tr>\n<td>Подтверждение уведомления об ИИ</td>\n<td>AsyncStorage</td>\n<td>Запоминает, что ты видел уведомление «ты общаешься с ИИ» (прозрачность по EU AI Act)</td>\n</tr>\n<tr>\n<td>Кэш каталога моделей</td>\n<td>AsyncStorage</td>\n<td>Быстрый запуск (без обращения к /models каждый раз)</td>\n</tr>\n<tr>\n<td>Метаданные состояния ключей</td>\n<td>рядом с самим ключом</td>\n<td>Кулдаун, заблокированные модели, последняя ошибка</td>\n</tr>\n<tr>\n<td>Использование токенов и примерная стоимость</td>\n<td>внутри каждого чата</td>\n<td>Показывается в информации о чате; вычисляется локально</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><strong>Ни один из этих данных не покидает твоё устройство</strong> — кроме момента,\nкогда ты нажимаешь «Отправить» и содержимое сообщения + ключ уходят\nнапрямую на сервер провайдера.</p>\n</blockquote>\n<hr>\n<h2>3. Что приложение <strong>отправляет</strong> наружу</h2>\n<h3>3.1 Провайдеры AI-моделей</h3>\n<p>Когда ты отправляешь сообщение, приложение делает <strong>HTTPS POST-запрос</strong> к\nвыбранному провайдеру (например, <a href=\"https://api.openai.com/v1/chat/completions\">https://api.openai.com/v1/chat/completions</a>).\nЗапрос содержит:</p>\n<ul>\n<li><strong>Твоё сообщение</strong> (текст + вложения, если есть — изображения, PDF, аудио)</li>\n<li><strong>История переписки</strong> (только сообщения <strong>этого</strong> чата)</li>\n<li><strong>Системный промпт</strong> (если ты его задал) и твоё имя (если ты его указал)</li>\n<li><strong>API-ключ</strong> (через заголовок, query-параметр или Bearer — зависит от провайдера)</li>\n</ul>\n<p>Что провайдер делает с этими данными, определяется <strong>его политикой\nконфиденциальности</strong>. Рекомендуем прочитать её перед использованием:</p>\n<ul>\n<li>OpenAI — <a href=\"https://openai.com/policies/privacy-policy\">https://openai.com/policies/privacy-policy</a></li>\n<li>Anthropic — <a href=\"https://www.anthropic.com/legal/privacy\">https://www.anthropic.com/legal/privacy</a></li>\n<li>Google AI — <a href=\"https://policies.google.com/privacy\">https://policies.google.com/privacy</a></li>\n<li>xAI — <a href=\"https://x.ai/legal/privacy-policy\">https://x.ai/legal/privacy-policy</a></li>\n<li>DeepSeek — <a href=\"https://platform.deepseek.com/privacy-policy\">https://platform.deepseek.com/privacy-policy</a></li>\n<li>Groq — <a href=\"https://groq.com/privacy-policy/\">https://groq.com/privacy-policy/</a></li>\n<li>OpenRouter — <a href=\"https://openrouter.ai/privacy\">https://openrouter.ai/privacy</a></li>\n</ul>\n<blockquote>\n<p>💡 Большинство провайдеров <strong>не используют API-запросы для обучения\nмоделей</strong> (в отличие от бесплатных веб-чатов). Тем не менее проверяй\nактуальное состояние их условий.</p>\n</blockquote>\n<h3>3.2 Список моделей</h3>\n<p>При запуске приложения (и когда ты нажимаешь «Обновить» в Настройках)\nприложение отправляет запрос к эндпоинту /models каждого провайдера, для\nкоторого у тебя есть ключ. Это лишь <strong>запрос списка</strong> (без сообщений),\nоднако ключ передаётся для аутентификации.</p>\n<h3>3.3 Голосовой ввод (распознавание речи)</h3>\n<p>Когда ты используешь микрофон, преобразование речи в текст выполняет\n<strong>системный сервис распознавания речи твоего устройства</strong> — Apple\n(SFSpeechRecognizer) на iOS, распознавание речи Google на Android или\nречевой движок твоего браузера в вебе. В зависимости от устройства и языка\n<strong>аудио может обрабатываться на серверах Apple или Google</strong> в соответствии\nс их политиками конфиденциальности. Само приложение <strong>не записывает и не\nхранит аудио</strong> — оно получает только готовый текст, который остаётся в поле\nввода, пока ты не решишь его отправить.</p>\n<h3>3.4 Жалобы на контент ИИ</h3>\n<p>Ты можешь пожаловаться на оскорбительный или неточный контент ИИ прямо из\nпереписки (иконка флажка рядом с сообщением ассистента). При этом откроется\n<strong>почтовый клиент твоего устройства</strong> с заранее заполненным письмом на\n<strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong>, содержащим выбранную тобой причину и фрагмент\nсообщения, на которое ты жалуешься (до 500 символов). Ничего не отправляется,\nпока ты сам не отправишь письмо — приложение не обращается ни к какому API\nдля жалоб.</p>\n<h3>3.5 Внешние ссылки для пожертвований</h3>\n<p>Экран «Поддержать разработку» содержит опциональные ссылки на <strong>Ko-fi</strong> и\n<strong>Buy Me a Coffee</strong>. Нажатие на них открывает внешний сайт в твоём браузере;\nлюбая оплата происходит целиком на этих сторонних сайтах в соответствии с их\nполитиками конфиденциальности. Само приложение не обрабатывает платежи и не\nполучает о них никаких данных.</p>\n<h3>3.6 Что приложение <strong>НЕ</strong> отправляет</h3>\n<ul>\n<li>Телеметрию (аналитику)</li>\n<li>Отчёты об ошибках (нет Sentry, Crashlytics, Bugsnag…)</li>\n<li>Push-уведомления (приложение их не использует)</li>\n<li>Геолокацию</li>\n<li>Контакты, календарь, фото без твоего явного выбора</li>\n<li>Переписку на любой сервер, кроме выбранного тобой провайдера</li>\n</ul>\n<hr>\n<h2>4. Разрешения устройства</h2>\n<p>Приложение будет запрашивать <strong>явные разрешения</strong> в момент использования:</p>\n<table>\n<thead>\n<tr>\n<th>Разрешение</th>\n<th>Когда запрашивается</th>\n<th>Зачем</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Библиотека фото</strong></td>\n<td>Только когда ты нажимаешь «Галерея» для вложения</td>\n<td>Выбрать изображение</td>\n</tr>\n<tr>\n<td><strong>Камера</strong></td>\n<td>Только когда ты нажимаешь «Фото» для вложения</td>\n<td>Сделать снимок</td>\n</tr>\n<tr>\n<td><strong>Микрофон</strong></td>\n<td>Только при первом нажатии на иконку микрофона</td>\n<td>Голосовой ввод (см. 3.3 — обрабатывается системным сервисом распознавания речи)</td>\n</tr>\n<tr>\n<td><strong>Интернет</strong></td>\n<td>Неявное</td>\n<td>Отправка запросов провайдерам</td>\n</tr>\n</tbody></table>\n<p>Системный диалог iOS / Android позволяет гибко управлять разрешениями —\nты можешь отказать, и приложение продолжит работу (просто без этой функции).</p>\n<hr>\n<h2>5. Прозрачность ИИ</h2>\n<p>При первом запуске приложение показывает чёткое уведомление о том, что <strong>ты\nобщаешься с искусственным интеллектом</strong>, в соответствии с требованиями\nпрозрачности EU AI Act. Ответы, сгенерированные ИИ, могут быть неточными\n(«галлюцинации») — проверяй важную информацию самостоятельно. Твоё\nподтверждение этого уведомления хранится только локально на твоём устройстве.</p>\n<hr>\n<h2>6. Твои права (GDPR)</h2>\n<p>Несмотря на то что приложение <strong>не хранит данные в облаке</strong>, ты обладаешь\nследующими правами в соответствии с Общим регламентом по защите данных:</p>\n<ul>\n<li><strong>Право доступа</strong> — всё, что хранит приложение, находится в песочнице\nтвоего устройства и видно в интерфейсе (переписки, ключи, настройки).</li>\n<li><strong>Право на исправление</strong> — любые данные можно изменить в Настройках.</li>\n<li><strong>Право на удаление</strong> — используй «Удалить все переписки» в Настройках\nи удаляй ключи по отдельности. Удаление приложения стирает всё.</li>\n<li><strong>Право на ограничение обработки</strong> — отключи отправку, удалив ключ;\nбез ключа приложение ничего не отправляет.</li>\n<li><strong>Право на переносимость данных</strong> — экспорт не реализован пока.\nВременное решение: долгое нажатие на сообщение → Копировать.\n(Массовый экспорт планируется для будущих версий.)</li>\n<li><strong>Право на возражение</strong> — свяжись с нами (см. ниже).</li>\n<li><strong>Право отозвать согласие</strong> — все разрешения можно отозвать в системных\nнастройках устройства.</li>\n</ul>\n<p>По вопросам жалоб ты можешь обратиться в компетентный орган по защите\nданных своей страны.</p>\n<hr>\n<h2>7. Дети</h2>\n<p>Приложение не предназначено для детей младше 13 лет. AI-модели могут\nгенерировать контент, неприемлемый для детей (у провайдеров есть собственные\nмеханизмы контроля, но они не совершенны). Ответственность за контроль\nиспользования лежит на родителях.</p>\n<hr>\n<h2>8. Изменения политики</h2>\n<p>Политика может измениться вместе с новой версией приложения. В случае\nсущественных изменений (например, добавления нового стороннего сервиса)\nмы обновим дату «Действует с» в начале документа и укажем причину в\nпримечаниях к новой версии.</p>\n<p>Эта политика доступна в приложении на нескольких языках; в случае\nрасхождений <strong>преимущество имеет английская версия</strong>.</p>\n<hr>\n<h2>Контакты</h2>\n<p>По любым вопросам, связанным с этой политикой:</p>\n<ul>\n<li>E-mail: <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong></li>\n<li>GitHub issue: см. репозиторий</li>\n</ul>\n","zh":"<h1>隐私政策 — Frend AI</h1>\n<p>本政策说明您在使用 Frend AI 应用（移动端及网页版）时<strong>会处理哪些数据</strong>。\n本应用遵循<strong>隐私设计</strong>原则——无自有后端、无需注册、不收集遥测数据。</p>\n<hr>\n<h2>1. 快速摘要</h2>\n<table>\n<thead>\n<tr>\n<th>问题</th>\n<th>回答</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>数据属于谁？</td>\n<td><strong>属于您。</strong> 所有内容都保留在您的设备上。</td>\n</tr>\n<tr>\n<td>数据会发送到其他地方吗？</td>\n<td>仅<strong>直接发送给您所填写 API 密钥对应的服务商</strong>（OpenAI、Anthropic 等）。</td>\n</tr>\n<tr>\n<td>您有后端服务器吗？</td>\n<td><strong>没有。</strong></td>\n</tr>\n<tr>\n<td>您有数据分析吗？</td>\n<td><strong>没有。</strong></td>\n</tr>\n<tr>\n<td>您有崩溃报告吗？</td>\n<td><strong>没有。</strong></td>\n</tr>\n<tr>\n<td>广告或应用内购买？</td>\n<td><strong>没有。</strong> 本应用无广告，也没有应用内购买。您可以通过可选的外部捐赠链接（Ko-fi、Buy Me a Coffee）支持开发。</td>\n</tr>\n<tr>\n<td>我可以删除我的数据吗？</td>\n<td>可以，在设置中一键即可完成。</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>2. 应用在本地（您的设备上）存储的内容</h2>\n<table>\n<thead>\n<tr>\n<th>数据</th>\n<th>存储位置</th>\n<th>用途</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>服务商 API 密钥</td>\n<td>iOS Keychain / Android Keystore（移动端），localStorage（网页端）</td>\n<td>向服务商发送请求时所需</td>\n</tr>\n<tr>\n<td>对话记录（聊天）</td>\n<td>应用沙盒中的 AsyncStorage</td>\n<td>您的历史记录、搜索、置顶</td>\n</tr>\n<tr>\n<td>附件（图片、PDF、音频）</td>\n<td>应用文档目录</td>\n<td>在重启/重装后保留（直至卸载）</td>\n</tr>\n<tr>\n<td>设置</td>\n<td>AsyncStorage</td>\n<td>默认模型、主题、应用语言、名称、系统提示词、快捷指令</td>\n</tr>\n<tr>\n<td>AI 提示确认记录</td>\n<td>AsyncStorage</td>\n<td>记录您已查看&quot;您正在与 AI 对话&quot;的提示（EU AI Act 透明度要求）</td>\n</tr>\n<tr>\n<td>模型目录缓存</td>\n<td>AsyncStorage</td>\n<td>加快启动速度（无需每次请求 /models 接口）</td>\n</tr>\n<tr>\n<td>密钥健康元数据</td>\n<td>与密钥本身存放在一起</td>\n<td>冷却时间、已屏蔽模型、最近一次错误</td>\n</tr>\n<tr>\n<td>Token 用量与预估费用</td>\n<td>每个对话内部</td>\n<td>在聊天信息页中显示；在本地计算</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><strong>上述数据绝不会离开您的设备</strong>——除非您点击&quot;发送&quot;，此时消息内容\n及密钥会直接传输至您所选服务商的服务器。</p>\n</blockquote>\n<hr>\n<h2>3. 应用<strong>向外发送</strong>的内容</h2>\n<h3>3.1 AI 模型服务商</h3>\n<p>当您发送消息时，应用会向您选择的服务商发送一条 <strong>HTTPS POST 请求</strong>\n（例如 <a href=\"https://api.openai.com/v1/chat/completions%EF%BC%89%E3%80%82%E8%AF%B7%E6%B1%82%E5%86%85%E5%AE%B9%E5%8C%85%E5%90%AB%EF%BC%9A\">https://api.openai.com/v1/chat/completions）。请求内容包含：</a></p>\n<ul>\n<li><strong>您的消息</strong>（文本及附件，如有——图片、PDF、音频）</li>\n<li><strong>对话历史</strong>（仅限<strong>该</strong>聊天的消息）</li>\n<li><strong>系统提示词</strong>（如果您已设置）以及您的名称（如果您已填写）</li>\n<li><strong>API 密钥</strong>（通过请求头、查询参数或 Bearer 方式传递，取决于服务商）</li>\n</ul>\n<p>服务商如何处理这些数据，由<strong>其隐私政策</strong>决定。使用前请务必阅读：</p>\n<ul>\n<li>OpenAI — <a href=\"https://openai.com/policies/privacy-policy\">https://openai.com/policies/privacy-policy</a></li>\n<li>Anthropic — <a href=\"https://www.anthropic.com/legal/privacy\">https://www.anthropic.com/legal/privacy</a></li>\n<li>Google AI — <a href=\"https://policies.google.com/privacy\">https://policies.google.com/privacy</a></li>\n<li>xAI — <a href=\"https://x.ai/legal/privacy-policy\">https://x.ai/legal/privacy-policy</a></li>\n<li>DeepSeek — <a href=\"https://platform.deepseek.com/privacy-policy\">https://platform.deepseek.com/privacy-policy</a></li>\n<li>Groq — <a href=\"https://groq.com/privacy-policy/\">https://groq.com/privacy-policy/</a></li>\n<li>OpenRouter — <a href=\"https://openrouter.ai/privacy\">https://openrouter.ai/privacy</a></li>\n</ul>\n<blockquote>\n<p>💡 大多数服务商<strong>不会将 API 请求用于模型训练</strong>\n（与免费网页端聊天不同）。即便如此，请随时关注其最新条款。</p>\n</blockquote>\n<h3>3.2 模型列表</h3>\n<p>应用启动时（以及您在设置中点击&quot;刷新&quot;时），应用会向您拥有密钥的每个\n服务商的 /models 接口发送请求。这仅是<strong>列表查询</strong>（不含消息内容），\n但密钥会随请求一同发送以进行身份验证。</p>\n<h3>3.3 语音输入（语音识别）</h3>\n<p>当您使用麦克风时，语音转文字由您<strong>设备的系统语音服务</strong>完成——iOS 上为\nApple（SFSpeechRecognizer），Android 上为 Google 语音识别，网页端则为\n您浏览器的语音引擎。根据设备和语言的不同，<strong>音频可能会在 Apple 或\nGoogle 的服务器上进行处理</strong>，并适用其隐私政策。本应用本身<strong>不会录制或\n存储音频</strong>——它只接收识别出的文字，文字会停留在消息输入框中，直至您\n决定发送。</p>\n<h3>3.4 举报 AI 内容</h3>\n<p>您可以直接在对话中举报令人反感或不准确的 AI 内容（助手消息旁的旗帜\n图标）。此操作会打开您<strong>设备上的电子邮件客户端</strong>，并预填一封发送至\n<strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong> 的邮件，其中包含您选择的举报原因以及被举报\n消息的摘录（最多 500 个字符）。在您亲自发送该邮件之前，不会发送任何\n内容——本应用不会与任何举报 API 通信。</p>\n<h3>3.5 外部捐赠链接</h3>\n<p>&quot;支持开发&quot;页面包含指向 <strong>Ko-fi</strong> 和 <strong>Buy Me a Coffee</strong> 的可选链接。\n点击后会在您的浏览器中打开外部网站；任何付款均完全在这些第三方网站上\n进行，并适用其各自的隐私政策。本应用本身不处理任何付款，也不会收到\n有关付款的任何数据。</p>\n<h3>3.6 应用<strong>不会</strong>发送的内容</h3>\n<ul>\n<li>遥测数据（数据分析）</li>\n<li>崩溃报告（不使用 Sentry、Crashlytics、Bugsnag 等）</li>\n<li>推送通知（本应用不使用）</li>\n<li>位置信息</li>\n<li>未经您明确选择的联系人、日历、照片</li>\n<li>将对话发送至除您所选服务商以外的任何服务器</li>\n</ul>\n<hr>\n<h2>4. 设备权限</h2>\n<p>应用会在实际使用时请求以下<strong>明确权限</strong>：</p>\n<table>\n<thead>\n<tr>\n<th>权限</th>\n<th>请求时机</th>\n<th>用途</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>照片库</strong></td>\n<td>仅在您点击附件中的&quot;相册&quot;时</td>\n<td>选择图片</td>\n</tr>\n<tr>\n<td><strong>相机</strong></td>\n<td>仅在您点击附件中的&quot;拍照&quot;时</td>\n<td>拍摄照片</td>\n</tr>\n<tr>\n<td><strong>麦克风</strong></td>\n<td>仅在您首次点击麦克风图标时</td>\n<td>语音输入（见 3.3——由系统语音服务处理）</td>\n</tr>\n<tr>\n<td><strong>网络</strong></td>\n<td>隐式授权</td>\n<td>向服务商发送请求</td>\n</tr>\n</tbody></table>\n<p>iOS / Android 系统弹窗支持精细化控制——您可以拒绝授权，应用仍可正常\n使用（仅相应功能不可用）。</p>\n<hr>\n<h2>5. AI 透明度</h2>\n<p>应用首次启动时会显示一条清晰的提示，告知您<strong>正在与人工智能对话</strong>，\n以符合 EU AI Act 的透明度要求。AI 生成的回答可能不准确（&quot;幻觉&quot;）——\n请自行核实重要信息。您对该提示的确认仅存储在您设备的本地。</p>\n<hr>\n<h2>6. 您的权利（GDPR（通用数据保护条例））</h2>\n<p>尽管本应用<strong>不在云端存储数据</strong>，根据通用数据保护条例，您享有以下权利：</p>\n<ul>\n<li><strong>访问权</strong> — 应用所持有的所有内容均在您设备的沙盒中，可在界面内查看\n（对话、密钥、设置）。</li>\n<li><strong>更正权</strong> — 所有条目均可在设置中修改。</li>\n<li><strong>删除权</strong> — 在设置中使用&quot;删除所有对话&quot;，并逐一删除密钥。卸载应用\n将删除所有数据。</li>\n<li><strong>限制处理权</strong> — 通过删除密钥来停止发送；没有密钥，应用不会发送任何内容。</li>\n<li><strong>数据可携带权</strong> — 目前尚未实现导出功能。临时方案：长按消息 →\n复制。（批量导出将在未来版本推出。）</li>\n<li><strong>异议权</strong> — 请联系我们（见下方）。</li>\n<li><strong>撤回同意权</strong> — 所有权限均可在设备系统设置中撤销。</li>\n</ul>\n<p>如需投诉，您可联系所在国家/地区的主管数据保护机构（DPA）。</p>\n<hr>\n<h2>7. 儿童</h2>\n<p>本应用不适合 13 岁以下儿童使用。AI 模型可能生成不适合儿童的内容\n（服务商有自己的管控措施，但并不完善）。家长有责任对使用情况进行监督。</p>\n<hr>\n<h2>8. 政策变更</h2>\n<p>政策可能随新版本应用一同更新。如发生重大变更（例如新增第三方服务），\n我们将在文档顶部更新&quot;生效日期&quot;，并在新版本的发布说明中注明原因。</p>\n<p>本政策在应用内提供多种语言版本；如有不一致之处，以<strong>英文版本为准</strong>。</p>\n<hr>\n<h2>联系方式</h2>\n<p>如有任何关于本政策的问题：</p>\n<ul>\n<li>电子邮件：<strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong></li>\n<li>GitHub issue：请查看代码仓库</li>\n</ul>\n","ja":"<h1>プライバシーポリシー — Frend AI</h1>\n<p>このポリシーは、Frend AI アプリ（モバイル版およびウェブ版）をご利用いただく際に\n<strong>処理されるデータ</strong>について説明します。本アプリは<strong>プライバシー・バイ・デザイン</strong>\nの原則に基づいて設計されており、独自のバックエンドを持たず、サインインも\nテレメトリー収集も行いません。</p>\n<hr>\n<h2>1. 概要</h2>\n<table>\n<thead>\n<tr>\n<th>質問</th>\n<th>回答</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>データは誰のものですか？</td>\n<td><strong>あなたのものです。</strong> すべてはお使いのデバイス上に保存されます。</td>\n</tr>\n<tr>\n<td>どこかに送信されますか？</td>\n<td><strong>入力した API キーに対応するプロバイダーにのみ、直接送信されます</strong>（OpenAI、Anthropic など）。</td>\n</tr>\n<tr>\n<td>バックエンドはありますか？</td>\n<td><strong>ありません。</strong></td>\n</tr>\n<tr>\n<td>アナリティクスはありますか？</td>\n<td><strong>ありません。</strong></td>\n</tr>\n<tr>\n<td>クラッシュレポートはありますか？</td>\n<td><strong>ありません。</strong></td>\n</tr>\n<tr>\n<td>広告またはアプリ内購入はありますか？</td>\n<td><strong>ありません。</strong> 本アプリは広告フリーで、アプリ内購入もありません。開発の支援は、任意の外部寄付リンク（Ko-fi、Buy Me a Coffee）から行えます。</td>\n</tr>\n<tr>\n<td>データを削除できますか？</td>\n<td>はい、設定画面からワンタップで削除できます。</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>2. アプリがローカル（デバイス上）に保存するデータ</h2>\n<table>\n<thead>\n<tr>\n<th>データ</th>\n<th>保存場所</th>\n<th>目的</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>プロバイダーの API キー</td>\n<td>iOS Keychain / Android Keystore（モバイル）、localStorage（ウェブ）</td>\n<td>プロバイダーへのリクエスト送信に必要</td>\n</tr>\n<tr>\n<td>会話履歴（チャット）</td>\n<td>アプリのサンドボックス内の AsyncStorage</td>\n<td>履歴・検索・ピン留め</td>\n</tr>\n<tr>\n<td>添付ファイル（画像・PDF・音声）</td>\n<td>アプリのドキュメントディレクトリ</td>\n<td>再起動・再インストール後も保持するため（アンインストールまで）</td>\n</tr>\n<tr>\n<td>設定</td>\n<td>AsyncStorage</td>\n<td>デフォルトモデル、テーマ、アプリの言語、名前、システムプロンプト、ショートカット</td>\n</tr>\n<tr>\n<td>AI に関する通知の確認記録</td>\n<td>AsyncStorage</td>\n<td>「AI と会話しています」という通知を確認済みであることを記録（EU AI Act の透明性要件）</td>\n</tr>\n<tr>\n<td>モデルカタログのキャッシュ</td>\n<td>AsyncStorage</td>\n<td>起動を高速化するため（毎回 /models を叩かないよう）</td>\n</tr>\n<tr>\n<td>キーごとのヘルスメタデータ</td>\n<td>キー自体と同じ場所</td>\n<td>クールダウン、ブロックされたモデル、最後のエラー</td>\n</tr>\n<tr>\n<td>トークン使用量と推定コスト</td>\n<td>各チャットの内部</td>\n<td>チャット情報シートに表示。ローカルで計算されます</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><strong>これらのデータがデバイスの外に出ることはありません</strong> — ただし「送信」を\nタップした瞬間は除きます。その際、メッセージの内容とキーが選択した\nプロバイダーのサーバーに直接送信されます。</p>\n</blockquote>\n<hr>\n<h2>3. アプリが<strong>外部に送信</strong>するもの</h2>\n<h3>3.1 AI モデルプロバイダー</h3>\n<p>メッセージを送信すると、アプリは選択したプロバイダーに対して\n<strong>HTTPS POST リクエスト</strong>を送ります（例：<a href=\"https://api.openai.com/v1/chat/completions%EF%BC%89%E3%80%82\">https://api.openai.com/v1/chat/completions）。</a>\nリクエストには以下が含まれます：</p>\n<ul>\n<li><strong>あなたのメッセージ</strong>（テキスト＋添付ファイル、ある場合 — 画像・PDF・音声）</li>\n<li><strong>会話履歴</strong>（<strong>そのチャット</strong>のメッセージのみ）</li>\n<li><strong>システムプロンプト</strong>（設定している場合）とあなたの名前（入力している場合）</li>\n<li><strong>API キー</strong>（ヘッダー、クエリパラメーター、Bearer のいずれかでプロバイダーにより異なる）</li>\n</ul>\n<p>プロバイダーがそのデータをどのように扱うかは、<strong>各社のプライバシーポリシー</strong>\nによって定められています。利用前にご確認ください：</p>\n<ul>\n<li>OpenAI — <a href=\"https://openai.com/policies/privacy-policy\">https://openai.com/policies/privacy-policy</a></li>\n<li>Anthropic — <a href=\"https://www.anthropic.com/legal/privacy\">https://www.anthropic.com/legal/privacy</a></li>\n<li>Google AI — <a href=\"https://policies.google.com/privacy\">https://policies.google.com/privacy</a></li>\n<li>xAI — <a href=\"https://x.ai/legal/privacy-policy\">https://x.ai/legal/privacy-policy</a></li>\n<li>DeepSeek — <a href=\"https://platform.deepseek.com/privacy-policy\">https://platform.deepseek.com/privacy-policy</a></li>\n<li>Groq — <a href=\"https://groq.com/privacy-policy/\">https://groq.com/privacy-policy/</a></li>\n<li>OpenRouter — <a href=\"https://openrouter.ai/privacy\">https://openrouter.ai/privacy</a></li>\n</ul>\n<blockquote>\n<p>💡 多くのプロバイダーは<strong>API リクエストをモデルのトレーニングに使用しません</strong>\n（無料のウェブチャットとは異なります）。それでも、各社の最新の利用規約を\n随時ご確認ください。</p>\n</blockquote>\n<h3>3.2 モデル一覧の取得</h3>\n<p>アプリ起動時（および設定で「更新」を押したとき）、アプリはキーを保有している\n各プロバイダーの /models エンドポイントにリクエストを送信します。これは\n<strong>一覧の取得</strong>のみ（メッセージは含まれません）ですが、認証のためにキーが\n送信されます。</p>\n<h3>3.3 音声入力（音声認識）</h3>\n<p>マイクを使用すると、音声からテキストへの変換は<strong>デバイスのシステム音声\nサービス</strong>によって行われます — iOS では Apple（SFSpeechRecognizer）、\nAndroid では Google の音声認識、ウェブではブラウザの音声エンジンです。\nデバイスと言語によっては、<strong>音声が Apple または Google のサーバー上で\n処理される場合があり</strong>、その際は各社のプライバシーポリシーが適用されます。\nアプリ自体は<strong>音声を録音・保存しません</strong> — 認識結果のテキストを受け取る\nだけで、そのテキストは送信を決めるまでメッセージ入力欄に留まります。</p>\n<h3>3.4 AI コンテンツの報告</h3>\n<p>不快または不正確な AI コンテンツは、会話画面から直接報告できます\n（アシスタントのメッセージ横のフラグアイコン）。これにより、<strong>デバイスの\nメールクライアント</strong>が開き、<strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong> 宛のメッセージが\nあらかじめ入力されます。内容は、選択した報告理由と報告対象メッセージの\n抜粋（最大 500 文字）です。ご自身でメールを送信するまで何も送信されません —\nアプリはいかなる報告用 API とも通信しません。</p>\n<h3>3.5 外部の寄付リンク</h3>\n<p>「開発を支援する」画面には、<strong>Ko-fi</strong> と <strong>Buy Me a Coffee</strong> への任意の\nリンクがあります。タップするとブラウザで外部サイトが開きます。支払いは\nすべてそれらのサードパーティサイト上で、各社のプライバシーポリシーに\n基づいて行われます。アプリ自体は支払いを一切処理せず、支払いに関する\nデータも受け取りません。</p>\n<h3>3.6 アプリが<strong>送信しない</strong>もの</h3>\n<ul>\n<li>テレメトリー（アナリティクス）</li>\n<li>クラッシュレポート（Sentry・Crashlytics・Bugsnag 等は使用しません）</li>\n<li>プッシュ通知（本アプリでは使用しません）</li>\n<li>位置情報</li>\n<li>明示的な選択なしの連絡先・カレンダー・写真</li>\n<li>選択したプロバイダー以外のサーバーへの会話データ</li>\n</ul>\n<hr>\n<h2>4. デバイスの権限</h2>\n<p>アプリは使用時に以下の<strong>明示的な権限</strong>をリクエストします：</p>\n<table>\n<thead>\n<tr>\n<th>権限</th>\n<th>リクエストのタイミング</th>\n<th>目的</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>フォトライブラリ</strong></td>\n<td>添付ファイルの「ギャラリー」をタップしたときのみ</td>\n<td>画像の選択</td>\n</tr>\n<tr>\n<td><strong>カメラ</strong></td>\n<td>添付ファイルの「写真を撮る」をタップしたときのみ</td>\n<td>写真の撮影</td>\n</tr>\n<tr>\n<td><strong>マイク</strong></td>\n<td>初めてマイクアイコンをタップしたときのみ</td>\n<td>音声入力（3.3 を参照 — システムの音声サービスで処理されます）</td>\n</tr>\n<tr>\n<td><strong>インターネット</strong></td>\n<td>暗黙的</td>\n<td>プロバイダーへの送信</td>\n</tr>\n</tbody></table>\n<p>iOS / Android のシステムダイアログできめ細かく設定できます — 拒否しても\nアプリは動作します（その機能のみ使用不可になります）。</p>\n<hr>\n<h2>5. AI の透明性</h2>\n<p>初回起動時に、アプリは EU AI Act の透明性要件に沿って、<strong>人工知能と会話\nしている</strong>ことを明確に通知します。AI が生成する回答は不正確なことがあります\n（「ハルシネーション」）— 重要な情報はご自身で確認してください。この通知への\n確認は、お使いのデバイスのローカルにのみ保存されます。</p>\n<hr>\n<h2>6. お客様の権利（GDPR（一般データ保護規則））</h2>\n<p>本アプリは<strong>クラウド上にデータを保持しません</strong>が、一般データ保護規則に\n基づき、お客様には以下の権利があります：</p>\n<ul>\n<li><strong>アクセス権</strong> — アプリが保持するすべてのデータはデバイスのサンドボックス内に\nあり、UI 上で確認できます（会話・キー・設定）。</li>\n<li><strong>訂正権</strong> — すべての項目は設定から変更できます。</li>\n<li><strong>消去権</strong> — 設定の「すべての会話を削除」を使用し、キーは個別に削除して\nください。アプリをアンインストールするとすべて削除されます。</li>\n<li><strong>処理制限権</strong> — キーを削除することで送信を無効にできます。キーがなければ\nアプリは何も送信しません。</li>\n<li><strong>データポータビリティ権</strong> — 現在のところエクスポート機能は実装されて\nいません。代替手段：メッセージを長押し → コピー。（一括エクスポートは\n将来のバージョンで追加予定です。）</li>\n<li><strong>異議申し立て権</strong> — お問い合わせください（以下を参照）。</li>\n<li><strong>同意撤回権</strong> — すべての権限はデバイスのシステム設定から取り消せます。</li>\n</ul>\n<p>苦情については、お住まいの国・地域の管轄データ保護機関（DPA）にお問い合わせ\nいただけます。</p>\n<hr>\n<h2>7. お子様について</h2>\n<p>本アプリは 13 歳未満のお子様を対象としていません。AI モデルは子どもに\n適さないコンテンツを生成することがあります（プロバイダーには独自の管理\n手段がありますが、完全ではありません）。使用状況の監督は保護者の責任と\nなります。</p>\n<hr>\n<h2>8. ポリシーの変更</h2>\n<p>ポリシーは新しいアプリバージョンとともに変更される場合があります。\n重大な変更（新しいサードパーティサービスの追加など）が生じた場合、\n冒頭の「発効日」を更新し、新バージョンのリリースノートに理由を記載します。</p>\n<p>本ポリシーはアプリ内で複数の言語で提供されています。記載内容に相違が\nある場合は、<strong>英語版が優先されます</strong>。</p>\n<hr>\n<h2>お問い合わせ</h2>\n<p>本ポリシーに関するご質問はこちら：</p>\n<ul>\n<li>メール：<strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong></li>\n<li>GitHub issue：リポジトリをご参照ください</li>\n</ul>\n"};

  LANGS.forEach(function (l) {
    var o = document.createElement('option');
    o.value = l; o.textContent = NATIVE[l];
    sel.appendChild(o);
  });

  function detectLang() {
    try {
      var saved = localStorage.getItem('frendai-pp-lang');
      if (saved && CONTENT[saved]) return saved;
    } catch (e) {}
    var nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
    return CONTENT[nav] ? nav : 'en';
  }

  function setLang(l) {
    document.getElementById('content').innerHTML = CONTENT[l];
    document.getElementById('effectiveLabel').textContent = EFFECTIVE[l] + ': ' + DATE;
    document.documentElement.lang = l;
    sel.value = l;
    try { localStorage.setItem('frendai-pp-lang', l); } catch (e) {}
  }
  sel.addEventListener('change', function () { setLang(sel.value); });

  /* ---------- theme (dark/light, follows system, manual override) ---------- */
  var toggle = document.getElementById('themeToggle');
  function detectMode() {
    try {
      var saved = localStorage.getItem('frendai-pp-mode');
      if (saved === 'dark' || saved === 'light') return saved;
    } catch (e) {}
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
      ? 'light' : 'dark';
  }
  function setMode(m) {
    document.documentElement.setAttribute('data-mode', m);
    toggle.textContent = m === 'dark' ? '☀' : '☾';
    try { localStorage.setItem('frendai-pp-mode', m); } catch (e) {}
  }
  toggle.addEventListener('click', function () {
    setMode(document.documentElement.getAttribute('data-mode') === 'dark' ? 'light' : 'dark');
  });

  setMode(detectMode());
  setLang(detectLang());
</script>
</body>
</html>
