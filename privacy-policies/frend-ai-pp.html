<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Frend AI — Privacy Policy</title>
<style>
  /* ============ Design tokens — mirrored from src/theme.ts + gradientThemes.ts (purple) ============ */
  :root {
    --radius-md: 16px; --radius-lg: 20px; --radius-xl: 28px; --radius-pill: 30px;
  }
  html[data-mode="dark"] {
    --g1:#10131A; --g2:#1B2447; --g3:#3B2A6A; --g4:#6E2C7A; --g5:#A04060; --g6:#C2654E;
    --base:#0B0B12;
    --overlay: rgba(8, 6, 18, 0.18);
    --text:#F5F4FB;
    --text-muted: rgba(245, 244, 251, 0.72);
    --text-faint: rgba(245, 244, 251, 0.45);
    --accent:#C9B7FF;
    --accent-text:#1B1240;
    --accent-soft: rgba(201, 183, 255, 0.18);
    --glass-subtle: rgba(255, 255, 255, 0.06);
    --glass-regular: rgba(255, 255, 255, 0.10);
    --glass-strong: rgba(255, 255, 255, 0.16);
    --hairline: rgba(255, 255, 255, 0.12);
    --border-strong: rgba(255, 255, 255, 0.22);
    --shadow: 0 10px 18px rgba(0, 0, 0, 0.35);
  }
  html[data-mode="light"] {
    --g1:#F1F4FF; --g2:#DCE4FF; --g3:#E2D5FF; --g4:#F4D2EA; --g5:#FBD9C8; --g6:#FFE3D1;
    --base:#F4F4F8;
    --overlay: rgba(255, 255, 255, 0.05);
    --text:#1A1430;
    --text-muted: rgba(26, 20, 48, 0.66);
    --text-faint: rgba(26, 20, 48, 0.38);
    --accent:#6A55E5;
    --accent-text:#FFFFFF;
    --accent-soft: rgba(106, 85, 229, 0.16);
    --glass-subtle: rgba(255, 255, 255, 0.45);
    --glass-regular: rgba(255, 255, 255, 0.55);
    --glass-strong: rgba(255, 255, 255, 0.7);
    --hairline: rgba(26, 20, 48, 0.08);
    --border-strong: rgba(26, 20, 48, 0.16);
    --shadow: 0 10px 18px rgba(26, 20, 48, 0.12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--base);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; line-height: 22px;
    -webkit-font-smoothing: antialiased;
  }
  /* Background gradient — top-left → bottom-right, stops 0/20/45/65/85/100 as in the app */
  .bg {
    position: fixed; inset: 0; z-index: -2;
    background: linear-gradient(135deg,
      var(--g1) 0%, var(--g2) 20%, var(--g3) 45%, var(--g4) 65%, var(--g5) 85%, var(--g6) 100%);
  }
  .bg::after { content:""; position:absolute; inset:0; background: var(--overlay); }

  /* ============ Glass header (AppHeader style) ============ */
  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    background: var(--glass-subtle);
    border-bottom: 1px solid var(--hairline);
  }
  .header-inner {
    max-width: 780px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .brand .app { font-size: 17px; line-height: 22px; font-weight: 700; }
  .brand .sub { font-size: 11px; line-height: 14px; font-weight: 600; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.08em; }
  .spacer { flex: 1; }

  /* Glass pill controls */
  .pill {
    appearance: none; border: 1px solid var(--hairline);
    background: var(--glass-strong); color: var(--text);
    border-radius: var(--radius-pill); padding: 8px 14px;
    font-size: 13px; line-height: 18px; font-weight: 500;
    cursor: pointer; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .pill:hover { background: var(--accent-soft); }
  .pill:active { transform: scale(0.97); }
  select.pill { padding-right: 30px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%23999" stroke-width="1.6" stroke-linecap="round"/></svg>');
    background-repeat: no-repeat; background-position: right 12px center;
  }
  select.pill option { color: #1A1430; background: #FFFFFF; }
  #themeToggle { width: 38px; height: 38px; padding: 0; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }

  /* ============ Content — glass card ============ */
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px 48px; }
  .meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 4px 2px 16px;
    font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-muted);
  }
  .meta .chip {
    background: var(--accent-soft); color: var(--text);
    border: 1px solid var(--hairline); border-radius: 999px; padding: 3px 10px;
    font-size: 11px; font-weight: 600;
  }
  article {
    background: var(--glass-regular);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-xl);
    padding: 28px 28px 20px;
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: var(--shadow);
    overflow-wrap: break-word;
  }
  @media (max-width: 520px) { article { padding: 20px 16px 14px; border-radius: var(--radius-lg); } }

  /* ============ Markdown typography (theme.ts typography scale) ============ */
  article h1 { font-size: 28px; line-height: 34px; font-weight: 700; margin: 0 0 12px; letter-spacing: -0.01em; }
  article h2 { font-size: 24px; line-height: 30px; font-weight: 700; margin: 28px 0 10px; }
  article h3 { font-size: 17px; line-height: 22px; font-weight: 700; margin: 20px 0 8px; }
  article p, article li { font-size: 16px; line-height: 24px; color: var(--text); }
  article p { margin: 10px 0; }
  article ul { padding-left: 22px; margin: 10px 0; }
  article li { margin: 4px 0; }
  article strong { font-weight: 600; }
  article a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  article a:hover { border-bottom-color: var(--accent); }
  article hr { border: none; border-top: 1px solid var(--hairline); margin: 24px 0; }
  article blockquote {
    margin: 14px 0; padding: 10px 16px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 var(--radius-md) var(--radius-md) 0;
  }
  article blockquote p { margin: 4px 0; color: var(--text); }

  /* Tables — glass style with hairline borders */
  article table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    margin: 14px 0; font-size: 14.5px; line-height: 21px;
    border: 1px solid var(--hairline); border-radius: var(--radius-md);
    overflow: hidden; background: var(--glass-subtle);
  }
  article th, article td { padding: 9px 12px; text-align: left; vertical-align: top; }
  article th {
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); background: var(--glass-regular);
    border-bottom: 1px solid var(--hairline);
  }
  article tr + tr td { border-top: 1px solid var(--hairline); }
  @media (max-width: 600px) {
    article table { display: block; overflow-x: auto; }
  }

  footer {
    max-width: 780px; margin: 0 auto; padding: 0 16px 32px;
    font-size: 11px; line-height: 14px; font-weight: 600; color: var(--text-faint);
    text-align: center;
  }
</style>
</head>
<body>
<div class="bg"></div>

<header>
  <div class="header-inner">
    <div class="brand">
      <span class="app">Frend AI</span>
      <span class="sub" id="subTitle">Privacy Policy</span>
    </div>
    <div class="spacer"></div>
    <select class="pill" id="langSelect" aria-label="Language"></select>
    <button class="pill" id="themeToggle" aria-label="Toggle theme">☾</button>
  </div>
</header>

<main>
  <div class="meta">
    <span class="chip">v1.2.0</span>
    <span id="effectiveLabel"></span>
  </div>
  <article id="content"></article>
</main>

<footer>Frend AI · privacy by design · Bearvil</footer>

<script>
  var CONTENT = {"en":"<h1>Privacy Policy — Frend AI</h1>\n<p>This policy describes <strong>which data is processed</strong> when you use the Frend AI\napp (mobile and web versions). The app is designed on the principle of\n<strong>privacy by design</strong> — no backend of its own, no sign-in, no telemetry.</p>\n<hr>\n<h2>1. Quick summary</h2>\n<table>\n<thead>\n<tr>\n<th>Question</th>\n<th>Answer</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Whose data is it?</td>\n<td><strong>Yours.</strong> Everything stays on your device.</td>\n</tr>\n<tr>\n<td>Do you send it anywhere?</td>\n<td>Only <strong>directly to the providers whose keys you entered</strong> (OpenAI, Anthropic, …).</td>\n</tr>\n<tr>\n<td>Do you have a backend?</td>\n<td><strong>No.</strong></td>\n</tr>\n<tr>\n<td>Do you have analytics?</td>\n<td><strong>No.</strong></td>\n</tr>\n<tr>\n<td>Do you have a crash reporter?</td>\n<td><strong>No.</strong></td>\n</tr>\n<tr>\n<td>Ads or in-app purchases?</td>\n<td><strong>No.</strong> The app is ad-free with no in-app purchases. You can support development via optional external donation links (Ko-fi, Buy Me a Coffee).</td>\n</tr>\n<tr>\n<td>Can I delete my data?</td>\n<td>Yes, with one tap in Settings.</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>2. What the app stores locally (on your device)</h2>\n<table>\n<thead>\n<tr>\n<th>Data</th>\n<th>Where</th>\n<th>Why</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Provider API keys</td>\n<td>iOS Keychain / Android Keystore (mobile), localStorage (web)</td>\n<td>Needed to send requests to providers</td>\n</tr>\n<tr>\n<td>Conversations (chats)</td>\n<td>AsyncStorage in the app sandbox</td>\n<td>Your history, search, pins</td>\n</tr>\n<tr>\n<td>Attachments (images, PDFs, audio)</td>\n<td>App document directory</td>\n<td>To survive reboot/reinstall (until uninstall)</td>\n</tr>\n<tr>\n<td>Settings</td>\n<td>AsyncStorage</td>\n<td>Default model, theme, app language, name, system prompt, shortcuts</td>\n</tr>\n<tr>\n<td>AI notice acknowledgement</td>\n<td>AsyncStorage</td>\n<td>Remembers that you saw the &quot;you are talking to an AI&quot; notice (EU AI Act transparency)</td>\n</tr>\n<tr>\n<td>Model catalog cache</td>\n<td>AsyncStorage</td>\n<td>Faster startup (no /models hit every time)</td>\n</tr>\n<tr>\n<td>Per-key health metadata</td>\n<td>next to the key itself</td>\n<td>Cooldown, blocked models, last error</td>\n</tr>\n<tr>\n<td>Token usage &amp; estimated cost</td>\n<td>inside each chat</td>\n<td>Shown in the chat info sheet; computed locally</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><strong>None of this data ever leaves your device</strong> — except when you tap\n&quot;Send&quot; and the message content + key go directly to the provider&#39;s server.</p>\n</blockquote>\n<hr>\n<h2>3. What the app <strong>sends</strong> out</h2>\n<h3>3.1 AI model providers</h3>\n<p>When you send a message, the app makes an <strong>HTTPS POST request</strong> to the\nprovider you chose (e.g. <a href=\"https://api.openai.com/v1/chat/completions\">https://api.openai.com/v1/chat/completions</a>). The\nrequest contains:</p>\n<ul>\n<li><strong>Your message</strong> (text + attachments if any — images, PDFs, audio)</li>\n<li><strong>Conversation history</strong> (only messages from <strong>that one</strong> chat)</li>\n<li><strong>System prompt</strong> (if you set one) and your name (if you entered it)</li>\n<li><strong>API key</strong> (via header, query, or Bearer depending on the provider)</li>\n</ul>\n<p>What the provider does with that data is defined by <strong>its privacy policy</strong>.\nYou should read it before use:</p>\n<ul>\n<li>OpenAI — <a href=\"https://openai.com/policies/privacy-policy\">https://openai.com/policies/privacy-policy</a></li>\n<li>Anthropic — <a href=\"https://www.anthropic.com/legal/privacy\">https://www.anthropic.com/legal/privacy</a></li>\n<li>Google AI — <a href=\"https://policies.google.com/privacy\">https://policies.google.com/privacy</a></li>\n<li>xAI — <a href=\"https://x.ai/legal/privacy-policy\">https://x.ai/legal/privacy-policy</a></li>\n<li>DeepSeek — <a href=\"https://platform.deepseek.com/privacy-policy\">https://platform.deepseek.com/privacy-policy</a></li>\n<li>Groq — <a href=\"https://groq.com/privacy-policy/\">https://groq.com/privacy-policy/</a></li>\n<li>OpenRouter — <a href=\"https://openrouter.ai/privacy\">https://openrouter.ai/privacy</a></li>\n</ul>\n<blockquote>\n<p>💡 Most providers <strong>do not use API requests for model training</strong>\n(unlike free web chats). Still, check the current state of their terms.</p>\n</blockquote>\n<h3>3.2 Model listing</h3>\n<p>On app start (and when you press &quot;Refresh&quot; in Settings), the app sends a\nrequest to each provider&#39;s /models endpoint for which you have a key. This\nis only a <strong>listing</strong> (no messages), but the key is sent for authentication.</p>\n<h3>3.3 Voice input (speech recognition)</h3>\n<p>When you use the microphone, speech-to-text is performed by your\n<strong>device&#39;s system speech service</strong> — Apple (SFSpeechRecognizer) on iOS,\nGoogle speech recognition on Android, or your browser&#39;s speech engine on\nthe web. Depending on the device and language, <strong>audio may be processed on\nApple&#39;s or Google&#39;s servers</strong> under their privacy policies. The app itself\n<strong>does not record or store audio</strong> — it only receives the resulting text,\nwhich stays in the message field until you decide to send it.</p>\n<h3>3.4 Reporting AI content</h3>\n<p>You can report offensive or inaccurate AI content directly from a\nconversation (flag icon next to an assistant message). This opens your\n<strong>device&#39;s e-mail client</strong> with a pre-filled message to\n<strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong>, containing the reason you selected and an excerpt\nof the reported message (up to 500 characters). Nothing is sent until you\nsend the e-mail yourself — the app does not talk to any reporting API.</p>\n<h3>3.5 External donation links</h3>\n<p>The &quot;Support development&quot; screen contains optional links to <strong>Ko-fi</strong> and\n<strong>Buy Me a Coffee</strong>. Tapping them opens the external site in your browser;\nany payment happens entirely on those third-party sites under their own\nprivacy policies. The app itself processes no payments and receives no data\nabout them.</p>\n<h3>3.6 What the app does <strong>NOT</strong> send</h3>\n<ul>\n<li>Telemetry (analytics)</li>\n<li>Crash reports (no Sentry, Crashlytics, Bugsnag…)</li>\n<li>Push notifications (the app doesn&#39;t use them)</li>\n<li>Location</li>\n<li>Contacts, calendar, photos without your explicit selection</li>\n<li>Conversations to any server other than the provider you chose</li>\n</ul>\n<hr>\n<h2>4. Device permissions</h2>\n<p>The app will request <strong>explicit permissions</strong> at the moment of use for:</p>\n<table>\n<thead>\n<tr>\n<th>Permission</th>\n<th>When requested</th>\n<th>Why</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Photo library</strong></td>\n<td>Only when you tap &quot;Gallery&quot; for an attachment</td>\n<td>To pick an image</td>\n</tr>\n<tr>\n<td><strong>Camera</strong></td>\n<td>Only when you tap &quot;Photo&quot; for an attachment</td>\n<td>To take a picture</td>\n</tr>\n<tr>\n<td><strong>Microphone</strong></td>\n<td>Only when you first tap the mic icon</td>\n<td>Voice input (see 3.3 — processed by the system speech service)</td>\n</tr>\n<tr>\n<td><strong>Internet</strong></td>\n<td>Implicit</td>\n<td>Sending to providers</td>\n</tr>\n</tbody></table>\n<p>The iOS / Android system dialog is granular — you can decline and the app\nstill works (just without that functionality).</p>\n<hr>\n<h2>5. AI transparency</h2>\n<p>On first launch the app shows a clear notice that <strong>you are conversing with\nan artificial intelligence</strong>, in line with EU AI Act transparency\nrequirements. AI-generated answers can be inaccurate (&quot;hallucinations&quot;) —\nverify important information independently. Your acknowledgement of this\nnotice is stored only locally on your device.</p>\n<hr>\n<h2>6. Your rights (GDPR)</h2>\n<p>Although the app <strong>does not keep data in the cloud</strong>, here are your rights\nunder the General Data Protection Regulation:</p>\n<ul>\n<li><strong>Right of access</strong> — everything the app holds is in the sandbox on your\ndevice and visible in the UI (conversations, keys, settings).</li>\n<li><strong>Right to rectification</strong> — all entries can be changed in Settings.</li>\n<li><strong>Right to erasure</strong> — use &quot;Delete all conversations&quot; in Settings, and\ndelete keys individually. Uninstalling the app deletes everything.</li>\n<li><strong>Right to restriction of processing</strong> — disable sending by deleting the\nkey; without a key the app sends nothing.</li>\n<li><strong>Right to data portability</strong> — export is not yet implemented.\nWorkaround: long-press a message → Copy. (Bulk export is planned for future versions.)</li>\n<li><strong>Right to object</strong> — contact us (see below).</li>\n<li><strong>Right to withdraw consent</strong> — all permissions can be revoked in the\ndevice&#39;s system settings.</li>\n</ul>\n<p>For complaints you can contact your country&#39;s competent data protection\nauthority (DPA).</p>\n<hr>\n<h2>7. Children</h2>\n<p>The app is not intended for children under 13. AI models can generate\ncontent inappropriate for children (providers have their own controls, but\nthey are not perfect). Parents are responsible for supervising use.</p>\n<hr>\n<h2>8. Policy changes</h2>\n<p>The policy may change with a new app version. In case of significant\nchanges (e.g. adding a new third-party service), we will change the\n&quot;Effective from&quot; date at the top and state the reason in the new version&#39;s\nrelease notes.</p>\n<p>This policy is available in multiple languages in the app; in case of\ndiscrepancies, the <strong>English version prevails</strong>.</p>\n<hr>\n<h2>Contact</h2>\n<p>For any questions about this policy:</p>\n<ul>\n<li>E-mail: <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong></li>\n<li>GitHub issue: see the repository</li>\n</ul>\n","hr":"<h1>Politika privatnosti — Frend AI</h1>\n<p>Ova politika opisuje <strong>koji podaci se obrađuju</strong> kad koristiš Frend AI\naplikaciju (mobilna i web verzija). Aplikacija je dizajnirana po principu\n<strong>privacy by design</strong> — nema vlastitog backenda, nema prijave, nema\ntelemetrije.</p>\n<hr>\n<h2>1. Kratki sažetak</h2>\n<table>\n<thead>\n<tr>\n<th>Pitanje</th>\n<th>Odgovor</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Tko su moji podaci?</td>\n<td><strong>Tvoji.</strong> Sve ostaje na tvom uređaju.</td>\n</tr>\n<tr>\n<td>Šaljete li ih nekome?</td>\n<td>Samo <strong>direktno providerima čije ključeve si unio</strong> (OpenAI, Anthropic, …).</td>\n</tr>\n<tr>\n<td>Imate li backend?</td>\n<td><strong>Ne.</strong></td>\n</tr>\n<tr>\n<td>Imate li analytics?</td>\n<td><strong>Ne.</strong></td>\n</tr>\n<tr>\n<td>Imate li crash reporter?</td>\n<td><strong>Ne.</strong></td>\n</tr>\n<tr>\n<td>Reklame ili in-app kupnje?</td>\n<td><strong>Ne.</strong> App je bez reklama i bez in-app kupnji. Razvoj možeš podržati kroz opcionalne vanjske donacijske linkove (Ko-fi, Buy Me a Coffee).</td>\n</tr>\n<tr>\n<td>Mogu li obrisati podatke?</td>\n<td>Da, jednim klikom u Postavkama.</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>2. Što app sprema lokalno (na tvom uređaju)</h2>\n<table>\n<thead>\n<tr>\n<th>Podatak</th>\n<th>Gdje</th>\n<th>Zašto</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>API ključevi providera</td>\n<td>iOS Keychain / Android Keystore (mobile), localStorage (web)</td>\n<td>Potrebno za slanje requesta providerima</td>\n</tr>\n<tr>\n<td>Razgovori (chatovi)</td>\n<td>AsyncStorage u app sandbox-u</td>\n<td>Tvoja povijest, pretraga, pin</td>\n</tr>\n<tr>\n<td>Prilozi (slike, PDF, audio)</td>\n<td>App document direktorij</td>\n<td>Da preživi reboot/reinstall (do uninstall-a)</td>\n</tr>\n<tr>\n<td>Postavke</td>\n<td>AsyncStorage</td>\n<td>Default model, tema, jezik aplikacije, ime, sistemski prompt, prečaci</td>\n</tr>\n<tr>\n<td>Potvrda AI obavijesti</td>\n<td>AsyncStorage</td>\n<td>Pamti da si vidio obavijest &quot;razgovaraš s AI-jem&quot; (transparentnost po EU AI Act-u)</td>\n</tr>\n<tr>\n<td>Model katalog cache</td>\n<td>AsyncStorage</td>\n<td>Brži start (nemamo svaki put hit /models)</td>\n</tr>\n<tr>\n<td>Per-key health metadata</td>\n<td>uz sam ključ</td>\n<td>Cooldown, blocked modeli, zadnja greška</td>\n</tr>\n<tr>\n<td>Potrošnja tokena i procjena troška</td>\n<td>unutar svakog chata</td>\n<td>Prikazuje se u info sheetu chata; računa se lokalno</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><strong>Nijedan od ovih podataka nikad ne napušta tvoj uređaj</strong> — osim kad ti\nklikneš &quot;Send&quot; i sadržaj poruke + ključ ode direktno na provider-ov server.</p>\n</blockquote>\n<hr>\n<h2>3. Što app <strong>šalje</strong> prema vani</h2>\n<h3>3.1 Provideri AI modela</h3>\n<p>Kad pošalješ poruku, app radi <strong>HTTPS POST request</strong> na provider kojeg si\nizabrao (npr. <a href=\"https://api.openai.com/v1/chat/completions\">https://api.openai.com/v1/chat/completions</a>). U requestu se\nnalazi:</p>\n<ul>\n<li><strong>Tvoja poruka</strong> (tekst + prilozi ako ih ima — slike, PDF-ovi, audio)</li>\n<li><strong>Povijest razgovora</strong> (samo poruke iz <strong>tog jednog</strong> chata)</li>\n<li><strong>Sistemski prompt</strong> (ako si ga postavio) i tvoje ime (ako si ga unio)</li>\n<li><strong>API ključ</strong> (kroz header, query ili Bearer ovisno o provideru)</li>\n</ul>\n<p>Što provider radi s tim podacima, definira <strong>njegova politika privatnosti</strong>.\nTrebao bi je pročitati prije korištenja:</p>\n<ul>\n<li>OpenAI — <a href=\"https://openai.com/policies/privacy-policy\">https://openai.com/policies/privacy-policy</a></li>\n<li>Anthropic — <a href=\"https://www.anthropic.com/legal/privacy\">https://www.anthropic.com/legal/privacy</a></li>\n<li>Google AI — <a href=\"https://policies.google.com/privacy\">https://policies.google.com/privacy</a></li>\n<li>xAI — <a href=\"https://x.ai/legal/privacy-policy\">https://x.ai/legal/privacy-policy</a></li>\n<li>DeepSeek — <a href=\"https://platform.deepseek.com/privacy-policy\">https://platform.deepseek.com/privacy-policy</a></li>\n<li>Groq — <a href=\"https://groq.com/privacy-policy/\">https://groq.com/privacy-policy/</a></li>\n<li>OpenRouter — <a href=\"https://openrouter.ai/privacy\">https://openrouter.ai/privacy</a></li>\n</ul>\n<blockquote>\n<p>💡 Većina providera <strong>ne koristi API requeste za treniranje modela</strong>\n(drugačije od free web chatova). Ipak, provjeri trenutno stanje u njihovim\nuvjetima.</p>\n</blockquote>\n<h3>3.2 Listing modela</h3>\n<p>Pri startu app-a (i kad pritisneš &quot;Refresh&quot; u Postavkama), app pošalje\nzahtjev na /models endpoint svakog providera za kojeg imaš ključ. Ovo je\nsamo <strong>listing</strong> (bez poruka), ali se ključ šalje radi autentifikacije.</p>\n<h3>3.3 Glasovni unos (prepoznavanje govora)</h3>\n<p>Kad koristiš mikrofon, pretvorbu govora u tekst obavlja <strong>sistemski servis\nza prepoznavanje govora</strong> tvog uređaja — Apple (SFSpeechRecognizer) na\niOS-u, Googleovo prepoznavanje govora na Androidu, odnosno govorni engine\npreglednika na webu. Ovisno o uređaju i jeziku, <strong>audio se može obrađivati\nna Appleovim ili Googleovim serverima</strong> prema njihovim politikama\nprivatnosti. Sam app <strong>ne snima i ne sprema audio</strong> — prima samo dobiveni\ntekst, koji ostaje u polju za unos dok ga ti ne odlučiš poslati.</p>\n<h3>3.4 Prijava AI sadržaja</h3>\n<p>Uvredljiv ili netočan AI sadržaj možeš prijaviti direktno iz razgovora\n(flag ikona pored asistentove poruke). Time se otvara <strong>e-mail klijent na\ntvom uređaju</strong> s predispunjenom porukom na <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong>, koja\nsadrži razlog koji si odabrao i isječak prijavljene poruke (do 500\nznakova). Ništa se ne šalje dok ti sam ne pošalješ e-mail — app ne\nkomunicira ni s kakvim reporting API-jem.</p>\n<h3>3.5 Vanjski donacijski linkovi</h3>\n<p>Ekran &quot;Podrži razvoj&quot; sadrži opcionalne linkove na <strong>Ko-fi</strong> i <strong>Buy Me a\nCoffee</strong>. Tap na njih otvara vanjsku stranicu u tvom pregledniku; svako\nplaćanje odvija se u potpunosti na tim third-party stranicama prema\nnjihovim politikama privatnosti. Sam app ne procesira plaćanja i ne prima\nnikakve podatke o njima.</p>\n<h3>3.6 Što app <strong>NE</strong> šalje</h3>\n<ul>\n<li>Telemetriju (analytics)</li>\n<li>Crash reporte (nema Sentry, Crashlytics, Bugsnag…)</li>\n<li>Push notifikacije (app ih ne koristi)</li>\n<li>Lokaciju</li>\n<li>Kontakte, kalendar, fotografije bez tvog eksplicitnog odabira</li>\n<li>Razgovore na bilo koji server osim providera kojeg si izabrao</li>\n</ul>\n<hr>\n<h2>4. Dozvole uređaja</h2>\n<p>App će u trenutku korištenja zatražiti <strong>eksplicitne dozvole</strong> za:</p>\n<table>\n<thead>\n<tr>\n<th>Dozvola</th>\n<th>Kad se traži</th>\n<th>Zašto</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Foto galerija</strong></td>\n<td>Tek kad tapneš &quot;Galerija&quot; za prilog</td>\n<td>Da odabereš sliku</td>\n</tr>\n<tr>\n<td><strong>Kamera</strong></td>\n<td>Tek kad tapneš &quot;Foto&quot; za prilog</td>\n<td>Da snimiš sliku</td>\n</tr>\n<tr>\n<td><strong>Mikrofon</strong></td>\n<td>Tek kad prvi put tapneš mic ikonu</td>\n<td>Glasovni unos (vidi 3.3 — obrađuje sistemski servis za govor)</td>\n</tr>\n<tr>\n<td><strong>Internet</strong></td>\n<td>Implicitno</td>\n<td>Slanje na providere</td>\n</tr>\n</tbody></table>\n<p>iOS / Android sistemski dialog je granularan — možeš odbiti i app i dalje\nfunkcionira (samo bez te funkcionalnosti).</p>\n<hr>\n<h2>5. AI transparentnost</h2>\n<p>Pri prvom pokretanju app prikazuje jasnu obavijest da <strong>razgovaraš s\numjetnom inteligencijom</strong>, u skladu sa zahtjevima transparentnosti EU AI\nAct-a. AI odgovori mogu biti netočni (&quot;halucinacije&quot;) — važne informacije\nprovjeri neovisno. Tvoja potvrda te obavijesti sprema se samo lokalno na\ntvom uređaju.</p>\n<hr>\n<h2>6. Tvoja prava (GDPR)</h2>\n<p>Iako app <strong>ne čuva podatke u oblaku</strong>, navodimo prava iz Opće uredbe o\nzaštiti podataka:</p>\n<ul>\n<li><strong>Pravo pristupa</strong> — sve što app drži je u sandbox-u na tvom uređaju i\nvidljivo je u UI-u (razgovori, ključevi, postavke).</li>\n<li><strong>Pravo na ispravak</strong> — sve unosi se mogu mijenjati u Postavkama.</li>\n<li><strong>Pravo na brisanje</strong> — koristi &quot;Obriši sve razgovore&quot; u Postavkama, i\nobriši ključeve pojedinačno. Uninstall app-a briše baš sve.</li>\n<li><strong>Pravo na ograničavanje obrade</strong> — onemogući slanje tako da obrišeš\nključ; bez ključa app ne šalje ništa.</li>\n<li><strong>Pravo na prenosivost podataka</strong> — eksport još nije implementiran.\nWorkaround: long-press na poruku → Kopiraj. (Bulk export je planiran za buduće verzije.)</li>\n<li><strong>Pravo na prigovor</strong> — kontaktiraj nas (vidi dolje).</li>\n<li><strong>Pravo na povlačenje suglasnosti</strong> — sve dozvole se mogu povući u\nsistemskim postavkama uređaja.</li>\n</ul>\n<p>Za pritužbe se možeš obratiti <strong>Agenciji za zaštitu osobnih podataka</strong>\n(AZOP) u RH ili nadležnom DPA u svojoj zemlji.</p>\n<hr>\n<h2>7. Djeca</h2>\n<p>App nije namijenjen djeci ispod 13 godina. AI modeli mogu generirati sadržaj\nneprikladan za djecu (provideri imaju vlastite kontrole, ali nisu savršene).\nRoditelji su odgovorni za nadzor korištenja.</p>\n<hr>\n<h2>8. Promjene politike</h2>\n<p>Politika se može promijeniti uz novu verziju app-a. U slučaju značajnih\npromjena (npr. dodavanje nove third-party usluge), promijenit ćemo &quot;Vrijedi\nod&quot; datum na vrhu i navesti razlog u release notes-ima nove verzije.</p>\n<p>Politika je u aplikaciji dostupna na više jezika; u slučaju odstupanja\nmjerodavna je <strong>engleska verzija</strong>.</p>\n<hr>\n<h2>Kontakt</h2>\n<p>Za sva pitanja o ovoj politici:</p>\n<ul>\n<li>E-mail: <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong></li>\n<li>GitHub issue: vidi repo</li>\n</ul>\n","de":"<h1>Datenschutzerklärung — Frend AI</h1>\n<p>Diese Richtlinie beschreibt, <strong>welche Daten verarbeitet werden</strong>, wenn du die\nFrend AI App (Mobile- und Webversion) nutzt. Die App basiert auf dem Prinzip\n<strong>Privacy by Design</strong> — kein eigenes Backend, kein Login, keine Telemetrie.</p>\n<hr>\n<h2>1. Kurzübersicht</h2>\n<table>\n<thead>\n<tr>\n<th>Frage</th>\n<th>Antwort</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Wem gehören die Daten?</td>\n<td><strong>Dir.</strong> Alles bleibt auf deinem Gerät.</td>\n</tr>\n<tr>\n<td>Werden Daten irgendwohin gesendet?</td>\n<td>Nur <strong>direkt an die Anbieter, deren API-Schlüssel du eingegeben hast</strong> (OpenAI, Anthropic, …).</td>\n</tr>\n<tr>\n<td>Gibt es ein Backend?</td>\n<td><strong>Nein.</strong></td>\n</tr>\n<tr>\n<td>Gibt es Analyse-Tools?</td>\n<td><strong>Nein.</strong></td>\n</tr>\n<tr>\n<td>Gibt es einen Crash-Reporter?</td>\n<td><strong>Nein.</strong></td>\n</tr>\n<tr>\n<td>Werbung oder In-App-Käufe?</td>\n<td><strong>Nein.</strong> Die App ist werbefrei und enthält keine In-App-Käufe. Du kannst die Entwicklung über optionale externe Spendenlinks unterstützen (Ko-fi, Buy Me a Coffee).</td>\n</tr>\n<tr>\n<td>Kann ich meine Daten löschen?</td>\n<td>Ja, mit einem Tippen in den Einstellungen.</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>2. Was die App lokal speichert (auf deinem Gerät)</h2>\n<table>\n<thead>\n<tr>\n<th>Daten</th>\n<th>Speicherort</th>\n<th>Zweck</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Provider-API-Schlüssel</td>\n<td>iOS Keychain / Android Keystore (mobil), localStorage (Web)</td>\n<td>Benötigt zum Senden von Anfragen an Anbieter</td>\n</tr>\n<tr>\n<td>Unterhaltungen (Chats)</td>\n<td>AsyncStorage in der App-Sandbox</td>\n<td>Dein Verlauf, Suche, angeheftete Chats</td>\n</tr>\n<tr>\n<td>Anhänge (Bilder, PDFs, Audio)</td>\n<td>App-Dokumentenverzeichnis</td>\n<td>Überleben Neustart/Neuinstallation (bis zur Deinstallation)</td>\n</tr>\n<tr>\n<td>Einstellungen</td>\n<td>AsyncStorage</td>\n<td>Standardmodell, Theme, App-Sprache, Name, System-Prompt, Shortcuts</td>\n</tr>\n<tr>\n<td>Bestätigung des KI-Hinweises</td>\n<td>AsyncStorage</td>\n<td>Merkt sich, dass du den Hinweis „du sprichst mit einer KI&quot; gesehen hast (Transparenz gemäß EU AI Act)</td>\n</tr>\n<tr>\n<td>Modell-Katalog-Cache</td>\n<td>AsyncStorage</td>\n<td>Schnellerer Start (kein /models-Aufruf bei jedem Start)</td>\n</tr>\n<tr>\n<td>Schlüssel-Metadaten zur Verfügbarkeit</td>\n<td>neben dem Schlüssel selbst</td>\n<td>Cooldown, blockierte Modelle, letzter Fehler</td>\n</tr>\n<tr>\n<td>Token-Verbrauch &amp; geschätzte Kosten</td>\n<td>innerhalb jedes Chats</td>\n<td>Angezeigt im Chat-Info-Sheet; lokal berechnet</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><strong>Keine dieser Daten verlässt jemals dein Gerät</strong> — außer wenn du auf\n„Senden&quot; tippst und der Nachrichteninhalt + Schlüssel direkt an den Server\ndes Anbieters gesendet werden.</p>\n</blockquote>\n<hr>\n<h2>3. Was die App <strong>sendet</strong></h2>\n<h3>3.1 KI-Modellanbieter</h3>\n<p>Wenn du eine Nachricht sendest, stellt die App eine <strong>HTTPS-POST-Anfrage</strong> an\nden von dir gewählten Anbieter (z. B. <a href=\"https://api.openai.com/v1/chat/completions\">https://api.openai.com/v1/chat/completions</a>).\nDie Anfrage enthält:</p>\n<ul>\n<li><strong>Deine Nachricht</strong> (Text + Anhänge, falls vorhanden — Bilder, PDFs, Audio)</li>\n<li><strong>Gesprächsverlauf</strong> (nur Nachrichten aus <strong>diesem einen</strong> Chat)</li>\n<li><strong>System-Prompt</strong> (falls du einen gesetzt hast) und deinen Namen (falls du ihn eingegeben hast)</li>\n<li><strong>API-Schlüssel</strong> (per Header, Query-Parameter oder Bearer, je nach Anbieter)</li>\n</ul>\n<p>Was der Anbieter mit diesen Daten macht, regelt <strong>seine Datenschutzrichtlinie</strong>.\nDu solltest sie vor der Nutzung lesen:</p>\n<ul>\n<li>OpenAI — <a href=\"https://openai.com/policies/privacy-policy\">https://openai.com/policies/privacy-policy</a></li>\n<li>Anthropic — <a href=\"https://www.anthropic.com/legal/privacy\">https://www.anthropic.com/legal/privacy</a></li>\n<li>Google AI — <a href=\"https://policies.google.com/privacy\">https://policies.google.com/privacy</a></li>\n<li>xAI — <a href=\"https://x.ai/legal/privacy-policy\">https://x.ai/legal/privacy-policy</a></li>\n<li>DeepSeek — <a href=\"https://platform.deepseek.com/privacy-policy\">https://platform.deepseek.com/privacy-policy</a></li>\n<li>Groq — <a href=\"https://groq.com/privacy-policy/\">https://groq.com/privacy-policy/</a></li>\n<li>OpenRouter — <a href=\"https://openrouter.ai/privacy\">https://openrouter.ai/privacy</a></li>\n</ul>\n<blockquote>\n<p>💡 Die meisten Anbieter <strong>verwenden API-Anfragen nicht zum Modelltraining</strong>\n(anders als kostenlose Web-Chats). Prüfe dennoch den aktuellen Stand ihrer\nNutzungsbedingungen.</p>\n</blockquote>\n<h3>3.2 Modell-Auflistung</h3>\n<p>Beim App-Start (und wenn du in den Einstellungen auf „Aktualisieren&quot; drückst)\nsendet die App eine Anfrage an den /models-Endpunkt jedes Anbieters, für den\ndu einen Schlüssel hinterlegt hast. Es handelt sich nur um eine <strong>Auflistung</strong>\n(keine Nachrichten), jedoch wird der Schlüssel zur Authentifizierung mitgesendet.</p>\n<h3>3.3 Spracheingabe (Spracherkennung)</h3>\n<p>Wenn du das Mikrofon nutzt, erfolgt die Umwandlung von Sprache in Text durch\nden <strong>System-Sprachdienst deines Geräts</strong> — Apple (SFSpeechRecognizer) auf iOS,\ndie Google-Spracherkennung auf Android oder die Sprach-Engine deines Browsers\nim Web. Je nach Gerät und Sprache <strong>kann das Audio auf den Servern von Apple\noder Google verarbeitet werden</strong>, gemäß deren Datenschutzrichtlinien. Die App\nselbst <strong>nimmt kein Audio auf und speichert es nicht</strong> — sie erhält nur den\nerkannten Text, der im Eingabefeld bleibt, bis du dich entscheidest, ihn zu\nsenden.</p>\n<h3>3.4 Melden von KI-Inhalten</h3>\n<p>Du kannst anstößige oder ungenaue KI-Inhalte direkt aus einer Unterhaltung\nmelden (Flaggen-Symbol neben einer Assistenten-Nachricht). Dabei öffnet sich\nder <strong>E-Mail-Client deines Geräts</strong> mit einer vorausgefüllten Nachricht an\n<strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong>, die den von dir gewählten Grund und einen Auszug der\ngemeldeten Nachricht (bis zu 500 Zeichen) enthält. Es wird nichts gesendet,\nbis du die E-Mail selbst abschickst — die App kommuniziert mit keiner\nMelde-API.</p>\n<h3>3.5 Externe Spendenlinks</h3>\n<p>Der Bildschirm „Entwicklung unterstützen&quot; enthält optionale Links zu <strong>Ko-fi</strong>\nund <strong>Buy Me a Coffee</strong>. Beim Antippen öffnet sich die externe Seite in deinem\nBrowser; jede Zahlung erfolgt vollständig auf diesen Drittanbieter-Seiten\ngemäß deren eigenen Datenschutzrichtlinien. Die App selbst verarbeitet keine\nZahlungen und erhält keine Daten darüber.</p>\n<h3>3.6 Was die App <strong>NICHT</strong> sendet</h3>\n<ul>\n<li>Telemetrie (Analyse-Daten)</li>\n<li>Absturzberichte (kein Sentry, Crashlytics, Bugsnag …)</li>\n<li>Push-Benachrichtigungen (die App nutzt sie nicht)</li>\n<li>Standort</li>\n<li>Kontakte, Kalender, Fotos ohne deine ausdrückliche Auswahl</li>\n<li>Unterhaltungen an einen anderen Server als den von dir gewählten Anbieter</li>\n</ul>\n<hr>\n<h2>4. Geräteberechtigungen</h2>\n<p>Die App fordert <strong>explizite Berechtigungen</strong> zum Zeitpunkt der Nutzung an für:</p>\n<table>\n<thead>\n<tr>\n<th>Berechtigung</th>\n<th>Wann angefordert</th>\n<th>Zweck</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Fotobibliothek</strong></td>\n<td>Nur wenn du für einen Anhang auf „Galerie&quot; tippst</td>\n<td>Um ein Bild auszuwählen</td>\n</tr>\n<tr>\n<td><strong>Kamera</strong></td>\n<td>Nur wenn du für einen Anhang auf „Foto&quot; tippst</td>\n<td>Um ein Bild aufzunehmen</td>\n</tr>\n<tr>\n<td><strong>Mikrofon</strong></td>\n<td>Nur wenn du das erste Mal auf das Mikrofon-Symbol tippst</td>\n<td>Spracheingabe (siehe 3.3 — verarbeitet durch den System-Sprachdienst)</td>\n</tr>\n<tr>\n<td><strong>Internet</strong></td>\n<td>Implizit</td>\n<td>Senden an Anbieter</td>\n</tr>\n</tbody></table>\n<p>Der iOS-/Android-Systemdialog ist granular — du kannst ablehnen und die App\nfunktioniert weiterhin (nur ohne diese Funktion).</p>\n<hr>\n<h2>5. KI-Transparenz</h2>\n<p>Beim ersten Start zeigt die App einen deutlichen Hinweis, dass <strong>du dich mit\neiner künstlichen Intelligenz unterhältst</strong>, im Einklang mit den\nTransparenzanforderungen des EU AI Act. KI-generierte Antworten können\nungenau sein („Halluzinationen&quot;) — überprüfe wichtige Informationen\nunabhängig. Deine Bestätigung dieses Hinweises wird ausschließlich lokal auf\ndeinem Gerät gespeichert.</p>\n<hr>\n<h2>6. Deine Rechte (DSGVO)</h2>\n<p>Obwohl die App <strong>keine Daten in der Cloud speichert</strong>, stehen dir folgende\nRechte gemäß der Datenschutz-Grundverordnung zu:</p>\n<ul>\n<li><strong>Auskunftsrecht</strong> — alles, was die App speichert, liegt in der Sandbox auf\ndeinem Gerät und ist in der Benutzeroberfläche sichtbar (Unterhaltungen,\nSchlüssel, Einstellungen).</li>\n<li><strong>Recht auf Berichtigung</strong> — alle Einträge können in den Einstellungen\ngeändert werden.</li>\n<li><strong>Recht auf Löschung</strong> — nutze „Alle Unterhaltungen löschen&quot; in den\nEinstellungen und lösche Schlüssel einzeln. Die Deinstallation der App\nlöscht alles.</li>\n<li><strong>Recht auf Einschränkung der Verarbeitung</strong> — deaktiviere das Senden, indem\ndu den Schlüssel löschst; ohne Schlüssel sendet die App nichts.</li>\n<li><strong>Recht auf Datenübertragbarkeit</strong> — Export ist noch nicht\nimplementiert. Workaround: Nachricht lang gedrückt halten → Kopieren.\n(Massenexport ist für zukünftige Versionen geplant.)</li>\n<li><strong>Widerspruchsrecht</strong> — kontaktiere uns (siehe unten).</li>\n<li><strong>Recht auf Widerruf der Einwilligung</strong> — alle Berechtigungen können in den\nSystemeinstellungen des Geräts widerrufen werden.</li>\n</ul>\n<p>Bei Beschwerden kannst du dich an die zuständige Datenschutzbehörde (DSB)\ndeines Landes wenden.</p>\n<hr>\n<h2>7. Kinder</h2>\n<p>Die App ist nicht für Kinder unter 13 Jahren gedacht. KI-Modelle können\nInhalte erzeugen, die für Kinder ungeeignet sind (Anbieter haben eigene\nKontrollen, die jedoch nicht perfekt sind). Eltern sind für die Aufsicht\nüber die Nutzung verantwortlich.</p>\n<hr>\n<h2>8. Änderungen dieser Richtlinie</h2>\n<p>Die Richtlinie kann sich mit einer neuen App-Version ändern. Bei wesentlichen\nÄnderungen (z. B. Hinzufügen eines neuen Drittanbieter-Dienstes) ändern wir\ndas Datum „Gültig ab&quot; oben und nennen den Grund in den Release Notes der\nneuen Version.</p>\n<p>Diese Richtlinie ist in der App in mehreren Sprachen verfügbar; bei\nAbweichungen ist die <strong>englische Version maßgeblich</strong>.</p>\n<hr>\n<h2>Kontakt</h2>\n<p>Bei Fragen zu dieser Richtlinie:</p>\n<ul>\n<li>E-Mail: <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong></li>\n<li>GitHub-Issue: siehe das Repository</li>\n</ul>\n","fr":"<h1>Politique de confidentialité — Frend AI</h1>\n<p>Cette politique décrit <strong>quelles données sont traitées</strong> lorsque vous utilisez\nl&#39;application Frend AI (versions mobile et web). L&#39;application est conçue selon\nle principe de <strong>protection de la vie privée dès la conception</strong> — pas de\nbackend propre, pas d&#39;inscription, pas de télémétrie.</p>\n<hr>\n<h2>1. Résumé rapide</h2>\n<table>\n<thead>\n<tr>\n<th>Question</th>\n<th>Réponse</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>À qui appartiennent les données ?</td>\n<td><strong>À vous.</strong> Tout reste sur votre appareil.</td>\n</tr>\n<tr>\n<td>Des données sont-elles envoyées quelque part ?</td>\n<td>Uniquement <strong>directement aux fournisseurs dont vous avez saisi les clés</strong> (OpenAI, Anthropic, …).</td>\n</tr>\n<tr>\n<td>Y a-t-il un backend ?</td>\n<td><strong>Non.</strong></td>\n</tr>\n<tr>\n<td>Y a-t-il des outils d&#39;analyse ?</td>\n<td><strong>Non.</strong></td>\n</tr>\n<tr>\n<td>Y a-t-il un rapporteur de plantages ?</td>\n<td><strong>Non.</strong></td>\n</tr>\n<tr>\n<td>Publicités ou achats in-app ?</td>\n<td><strong>Non.</strong> L&#39;application est sans publicité et sans achats in-app. Vous pouvez soutenir le développement via des liens de don externes facultatifs (Ko-fi, Buy Me a Coffee).</td>\n</tr>\n<tr>\n<td>Puis-je supprimer mes données ?</td>\n<td>Oui, en un seul geste dans les Paramètres.</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>2. Ce que l&#39;application stocke localement (sur votre appareil)</h2>\n<table>\n<thead>\n<tr>\n<th>Données</th>\n<th>Emplacement</th>\n<th>Raison</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Clés API des fournisseurs</td>\n<td>iOS Keychain / Android Keystore (mobile), localStorage (web)</td>\n<td>Nécessaires pour envoyer des requêtes aux fournisseurs</td>\n</tr>\n<tr>\n<td>Conversations (chats)</td>\n<td>AsyncStorage dans le bac à sable de l&#39;application</td>\n<td>Votre historique, recherche, épinglages</td>\n</tr>\n<tr>\n<td>Pièces jointes (images, PDF, audio)</td>\n<td>Répertoire de documents de l&#39;application</td>\n<td>Survivent au redémarrage / à la réinstallation (jusqu&#39;à la désinstallation)</td>\n</tr>\n<tr>\n<td>Paramètres</td>\n<td>AsyncStorage</td>\n<td>Modèle par défaut, thème, langue de l&#39;application, nom, invite système, raccourcis</td>\n</tr>\n<tr>\n<td>Confirmation de l&#39;avis IA</td>\n<td>AsyncStorage</td>\n<td>Mémorise que vous avez vu l&#39;avis « vous conversez avec une IA » (transparence selon le règlement européen EU AI Act)</td>\n</tr>\n<tr>\n<td>Cache du catalogue de modèles</td>\n<td>AsyncStorage</td>\n<td>Démarrage plus rapide (pas d&#39;appel /models à chaque lancement)</td>\n</tr>\n<tr>\n<td>Métadonnées de santé par clé</td>\n<td>à côté de la clé elle-même</td>\n<td>Temps de recharge, modèles bloqués, dernière erreur</td>\n</tr>\n<tr>\n<td>Consommation de tokens et coût estimé</td>\n<td>au sein de chaque chat</td>\n<td>Affichés dans la fiche d&#39;informations du chat ; calculés localement</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><strong>Aucune de ces données ne quitte jamais votre appareil</strong> — sauf lorsque vous\nappuyez sur « Envoyer » et que le contenu du message ainsi que la clé sont\ntransmis directement au serveur du fournisseur.</p>\n</blockquote>\n<hr>\n<h2>3. Ce que l&#39;application <strong>envoie</strong></h2>\n<h3>3.1 Fournisseurs de modèles d&#39;IA</h3>\n<p>Lorsque vous envoyez un message, l&#39;application effectue une <strong>requête HTTPS POST</strong>\nvers le fournisseur que vous avez choisi (ex. <a href=\"https://api.openai.com/v1/chat/completions\">https://api.openai.com/v1/chat/completions</a>).\nLa requête contient :</p>\n<ul>\n<li><strong>Votre message</strong> (texte + pièces jointes éventuelles — images, PDF, audio)</li>\n<li><strong>L&#39;historique de la conversation</strong> (uniquement les messages de <strong>ce</strong> chat)</li>\n<li><strong>L&#39;invite système</strong> (si vous en avez défini une) et votre nom (si vous l&#39;avez saisi)</li>\n<li><strong>La clé API</strong> (via en-tête, paramètre de requête ou Bearer selon le fournisseur)</li>\n</ul>\n<p>Ce que le fournisseur fait de ces données est défini par <strong>sa politique de\nconfidentialité</strong>. Nous vous recommandons de la lire avant utilisation :</p>\n<ul>\n<li>OpenAI — <a href=\"https://openai.com/policies/privacy-policy\">https://openai.com/policies/privacy-policy</a></li>\n<li>Anthropic — <a href=\"https://www.anthropic.com/legal/privacy\">https://www.anthropic.com/legal/privacy</a></li>\n<li>Google AI — <a href=\"https://policies.google.com/privacy\">https://policies.google.com/privacy</a></li>\n<li>xAI — <a href=\"https://x.ai/legal/privacy-policy\">https://x.ai/legal/privacy-policy</a></li>\n<li>DeepSeek — <a href=\"https://platform.deepseek.com/privacy-policy\">https://platform.deepseek.com/privacy-policy</a></li>\n<li>Groq — <a href=\"https://groq.com/privacy-policy/\">https://groq.com/privacy-policy/</a></li>\n<li>OpenRouter — <a href=\"https://openrouter.ai/privacy\">https://openrouter.ai/privacy</a></li>\n</ul>\n<blockquote>\n<p>💡 La plupart des fournisseurs <strong>n&#39;utilisent pas les requêtes API pour\nentraîner leurs modèles</strong> (contrairement aux chats web gratuits). Vérifiez\nnéanmoins l&#39;état actuel de leurs conditions d&#39;utilisation.</p>\n</blockquote>\n<h3>3.2 Listage des modèles</h3>\n<p>Au démarrage de l&#39;application (et lorsque vous appuyez sur « Actualiser » dans\nles Paramètres), l&#39;application envoie une requête à l&#39;endpoint /models de chaque\nfournisseur pour lequel vous avez une clé. Il s&#39;agit uniquement d&#39;un\n<strong>listage</strong> (sans message), mais la clé est envoyée à des fins d&#39;authentification.</p>\n<h3>3.3 Saisie vocale (reconnaissance vocale)</h3>\n<p>Lorsque vous utilisez le microphone, la conversion de la parole en texte est\neffectuée par le <strong>service vocal système de votre appareil</strong> — Apple\n(SFSpeechRecognizer) sur iOS, la reconnaissance vocale de Google sur Android,\nou le moteur vocal de votre navigateur sur le web. Selon l&#39;appareil et la\nlangue, <strong>l&#39;audio peut être traité sur les serveurs d&#39;Apple ou de Google</strong>,\nconformément à leurs politiques de confidentialité. L&#39;application elle-même\n<strong>n&#39;enregistre ni ne stocke aucun audio</strong> — elle ne reçoit que le texte\nrésultant, qui reste dans le champ de saisie jusqu&#39;à ce que vous décidiez de\nl&#39;envoyer.</p>\n<h3>3.4 Signalement de contenu IA</h3>\n<p>Vous pouvez signaler un contenu IA offensant ou inexact directement depuis une\nconversation (icône de drapeau à côté d&#39;un message de l&#39;assistant). Cela ouvre\nle <strong>client e-mail de votre appareil</strong> avec un message prérempli adressé à\n<strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong>, contenant le motif que vous avez sélectionné et un\nextrait du message signalé (jusqu&#39;à 500 caractères). Rien n&#39;est envoyé tant\nque vous n&#39;envoyez pas l&#39;e-mail vous-même — l&#39;application ne communique avec\naucune API de signalement.</p>\n<h3>3.5 Liens de don externes</h3>\n<p>L&#39;écran « Soutenir le développement » contient des liens facultatifs vers\n<strong>Ko-fi</strong> et <strong>Buy Me a Coffee</strong>. En les touchant, le site externe s&#39;ouvre\ndans votre navigateur ; tout paiement s&#39;effectue entièrement sur ces sites\ntiers, conformément à leurs propres politiques de confidentialité.\nL&#39;application elle-même ne traite aucun paiement et ne reçoit aucune donnée à\nleur sujet.</p>\n<h3>3.6 Ce que l&#39;application <strong>n&#39;envoie PAS</strong></h3>\n<ul>\n<li>Télémétrie (données d&#39;analyse)</li>\n<li>Rapports de plantage (pas de Sentry, Crashlytics, Bugsnag…)</li>\n<li>Notifications push (l&#39;application ne les utilise pas)</li>\n<li>Localisation</li>\n<li>Contacts, calendrier, photos sans votre sélection explicite</li>\n<li>Conversations vers un serveur autre que le fournisseur que vous avez choisi</li>\n</ul>\n<hr>\n<h2>4. Autorisations de l&#39;appareil</h2>\n<p>L&#39;application demande des <strong>autorisations explicites</strong> au moment de l&#39;utilisation pour :</p>\n<table>\n<thead>\n<tr>\n<th>Autorisation</th>\n<th>Quand elle est demandée</th>\n<th>Raison</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Bibliothèque de photos</strong></td>\n<td>Uniquement lorsque vous appuyez sur « Galerie » pour une pièce jointe</td>\n<td>Pour choisir une image</td>\n</tr>\n<tr>\n<td><strong>Appareil photo</strong></td>\n<td>Uniquement lorsque vous appuyez sur « Photo » pour une pièce jointe</td>\n<td>Pour prendre une photo</td>\n</tr>\n<tr>\n<td><strong>Microphone</strong></td>\n<td>Uniquement lors de la première pression sur l&#39;icône micro</td>\n<td>Saisie vocale (voir 3.3 — traitée par le service vocal système)</td>\n</tr>\n<tr>\n<td><strong>Internet</strong></td>\n<td>Implicite</td>\n<td>Envoi vers les fournisseurs</td>\n</tr>\n</tbody></table>\n<p>La boîte de dialogue système iOS / Android est granulaire — vous pouvez refuser\net l&#39;application continue de fonctionner (sans cette fonctionnalité uniquement).</p>\n<hr>\n<h2>5. Transparence en matière d&#39;IA</h2>\n<p>Au premier lancement, l&#39;application affiche un avis clair indiquant que <strong>vous\nconversez avec une intelligence artificielle</strong>, conformément aux exigences de\ntransparence du règlement européen EU AI Act. Les réponses générées par l&#39;IA\npeuvent être inexactes (« hallucinations ») — vérifiez les informations\nimportantes de manière indépendante. Votre confirmation de cet avis est\nstockée uniquement en local sur votre appareil.</p>\n<hr>\n<h2>6. Vos droits (RGPD)</h2>\n<p>Bien que l&#39;application <strong>ne conserve pas de données dans le cloud</strong>, voici vos\ndroits au titre du Règlement général sur la protection des données :</p>\n<ul>\n<li><strong>Droit d&#39;accès</strong> — tout ce que l&#39;application stocke se trouve dans le bac à\nsable de votre appareil et est visible dans l&#39;interface (conversations, clés,\nparamètres).</li>\n<li><strong>Droit de rectification</strong> — toutes les entrées peuvent être modifiées dans\nles Paramètres.</li>\n<li><strong>Droit à l&#39;effacement</strong> — utilisez « Supprimer toutes les conversations »\ndans les Paramètres et supprimez les clés individuellement. La désinstallation\nde l&#39;application supprime tout.</li>\n<li><strong>Droit à la limitation du traitement</strong> — désactivez l&#39;envoi en supprimant la\nclé ; sans clé, l&#39;application n&#39;envoie rien.</li>\n<li><strong>Droit à la portabilité des données</strong> — l&#39;export n&#39;est pas encore implémenté.\nSolution de contournement : appui long sur un message →\nCopier. (Export en masse prévu pour les versions futures.)</li>\n<li><strong>Droit d&#39;opposition</strong> — contactez-nous (voir ci-dessous).</li>\n<li><strong>Droit de retrait du consentement</strong> — toutes les autorisations peuvent être\nrévoquées dans les paramètres système de l&#39;appareil.</li>\n</ul>\n<p>Pour toute réclamation, vous pouvez contacter l&#39;autorité de protection des\ndonnées (APD) compétente de votre pays.</p>\n<hr>\n<h2>7. Mineurs</h2>\n<p>L&#39;application n&#39;est pas destinée aux enfants de moins de 13 ans. Les modèles\nd&#39;IA peuvent générer du contenu inapproprié pour les enfants (les fournisseurs\ndisposent de leurs propres contrôles, mais ils ne sont pas parfaits). Les\nparents sont responsables de superviser l&#39;utilisation.</p>\n<hr>\n<h2>8. Modifications de la politique</h2>\n<p>La politique peut évoluer avec une nouvelle version de l&#39;application. En cas de\nmodifications importantes (ex. ajout d&#39;un nouveau service tiers), nous\nchangerons la date « En vigueur à partir du » en haut du document et\nindiquerons la raison dans les notes de version de la nouvelle mise à jour.</p>\n<p>Cette politique est disponible en plusieurs langues dans l&#39;application ; en\ncas de divergence, la <strong>version anglaise prévaut</strong>.</p>\n<hr>\n<h2>Contact</h2>\n<p>Pour toute question concernant cette politique :</p>\n<ul>\n<li>E-mail : <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong></li>\n<li>Issue GitHub : voir le dépôt</li>\n</ul>\n","it":"<h1>Informativa sulla privacy — Frend AI</h1>\n<p>Questa informativa descrive <strong>quali dati vengono trattati</strong> quando usi l&#39;app\nFrend AI (versione mobile e web). L&#39;app è progettata secondo il principio\ndella <strong>privacy by design</strong> — nessun backend proprio, nessuna registrazione,\nnessuna telemetria.</p>\n<hr>\n<h2>1. Riepilogo rapido</h2>\n<table>\n<thead>\n<tr>\n<th>Domanda</th>\n<th>Risposta</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Di chi sono i dati?</td>\n<td><strong>Tuoi.</strong> Tutto rimane sul tuo dispositivo.</td>\n</tr>\n<tr>\n<td>Vengono inviati da qualche parte?</td>\n<td>Solo <strong>direttamente ai provider le cui chiavi hai inserito</strong> (OpenAI, Anthropic, …).</td>\n</tr>\n<tr>\n<td>Esiste un backend?</td>\n<td><strong>No.</strong></td>\n</tr>\n<tr>\n<td>Esistono strumenti di analisi?</td>\n<td><strong>No.</strong></td>\n</tr>\n<tr>\n<td>Esiste un sistema di segnalazione degli arresti anomali?</td>\n<td><strong>No.</strong></td>\n</tr>\n<tr>\n<td>Annunci o acquisti in-app?</td>\n<td><strong>No.</strong> L&#39;app è senza annunci e senza acquisti in-app. Puoi sostenere lo sviluppo tramite link di donazione esterni facoltativi (Ko-fi, Buy Me a Coffee).</td>\n</tr>\n<tr>\n<td>Posso eliminare i miei dati?</td>\n<td>Sì, con un tocco nelle Impostazioni.</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>2. Cosa l&#39;app archivia localmente (sul tuo dispositivo)</h2>\n<table>\n<thead>\n<tr>\n<th>Dati</th>\n<th>Dove</th>\n<th>Perché</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Chiavi API dei provider</td>\n<td>iOS Keychain / Android Keystore (mobile), localStorage (web)</td>\n<td>Necessarie per inviare richieste ai provider</td>\n</tr>\n<tr>\n<td>Conversazioni (chat)</td>\n<td>AsyncStorage nella sandbox dell&#39;app</td>\n<td>La tua cronologia, ricerca, chat fissate</td>\n</tr>\n<tr>\n<td>Allegati (immagini, PDF, audio)</td>\n<td>Directory documenti dell&#39;app</td>\n<td>Sopravvivono al riavvio/reinstallazione (fino alla disinstallazione)</td>\n</tr>\n<tr>\n<td>Impostazioni</td>\n<td>AsyncStorage</td>\n<td>Modello predefinito, tema, lingua dell&#39;app, nome, prompt di sistema, scorciatoie</td>\n</tr>\n<tr>\n<td>Conferma dell&#39;avviso sull&#39;AI</td>\n<td>AsyncStorage</td>\n<td>Ricorda che hai visto l&#39;avviso &quot;stai parlando con un&#39;AI&quot; (trasparenza ai sensi dell&#39;EU AI Act)</td>\n</tr>\n<tr>\n<td>Cache del catalogo modelli</td>\n<td>AsyncStorage</td>\n<td>Avvio più rapido (nessuna chiamata a /models ad ogni avvio)</td>\n</tr>\n<tr>\n<td>Metadati di stato per chiave</td>\n<td>accanto alla chiave stessa</td>\n<td>Cooldown, modelli bloccati, ultimo errore</td>\n</tr>\n<tr>\n<td>Consumo di token e costo stimato</td>\n<td>all&#39;interno di ogni chat</td>\n<td>Mostrati nella scheda informazioni della chat; calcolati localmente</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><strong>Nessuno di questi dati lascia mai il tuo dispositivo</strong> — tranne quando premi\n&quot;Invia&quot; e il contenuto del messaggio + la chiave vengono inviati direttamente\nal server del provider.</p>\n</blockquote>\n<hr>\n<h2>3. Cosa l&#39;app <strong>invia</strong></h2>\n<h3>3.1 Provider di modelli AI</h3>\n<p>Quando invii un messaggio, l&#39;app effettua una <strong>richiesta HTTPS POST</strong> al\nprovider che hai scelto (es. <a href=\"https://api.openai.com/v1/chat/completions\">https://api.openai.com/v1/chat/completions</a>).\nLa richiesta contiene:</p>\n<ul>\n<li><strong>Il tuo messaggio</strong> (testo + allegati, se presenti — immagini, PDF, audio)</li>\n<li><strong>La cronologia della conversazione</strong> (solo i messaggi di <strong>quella</strong> chat)</li>\n<li><strong>Il prompt di sistema</strong> (se ne hai impostato uno) e il tuo nome (se lo hai inserito)</li>\n<li><strong>La chiave API</strong> (tramite header, parametro query o Bearer, a seconda del provider)</li>\n</ul>\n<p>Ciò che il provider fa con quei dati è definito dalla <strong>sua informativa sulla\nprivacy</strong>. Ti consigliamo di leggerla prima dell&#39;uso:</p>\n<ul>\n<li>OpenAI — <a href=\"https://openai.com/policies/privacy-policy\">https://openai.com/policies/privacy-policy</a></li>\n<li>Anthropic — <a href=\"https://www.anthropic.com/legal/privacy\">https://www.anthropic.com/legal/privacy</a></li>\n<li>Google AI — <a href=\"https://policies.google.com/privacy\">https://policies.google.com/privacy</a></li>\n<li>xAI — <a href=\"https://x.ai/legal/privacy-policy\">https://x.ai/legal/privacy-policy</a></li>\n<li>DeepSeek — <a href=\"https://platform.deepseek.com/privacy-policy\">https://platform.deepseek.com/privacy-policy</a></li>\n<li>Groq — <a href=\"https://groq.com/privacy-policy/\">https://groq.com/privacy-policy/</a></li>\n<li>OpenRouter — <a href=\"https://openrouter.ai/privacy\">https://openrouter.ai/privacy</a></li>\n</ul>\n<blockquote>\n<p>💡 La maggior parte dei provider <strong>non usa le richieste API per addestrare\ni modelli</strong> (a differenza delle chat web gratuite). Verifica comunque lo\nstato attuale dei loro termini.</p>\n</blockquote>\n<h3>3.2 Elenco dei modelli</h3>\n<p>All&#39;avvio dell&#39;app (e quando premi &quot;Aggiorna&quot; nelle Impostazioni), l&#39;app invia\nuna richiesta all&#39;endpoint /models di ogni provider per cui hai una chiave. Si\ntratta solo di un <strong>elenco</strong> (nessun messaggio), ma la chiave viene inviata a\nfini di autenticazione.</p>\n<h3>3.3 Input vocale (riconoscimento vocale)</h3>\n<p>Quando usi il microfono, la conversione da voce a testo viene eseguita dal\n<strong>servizio vocale di sistema del tuo dispositivo</strong> — Apple (SFSpeechRecognizer)\nsu iOS, il riconoscimento vocale di Google su Android, o il motore vocale del\ntuo browser sul web. A seconda del dispositivo e della lingua, <strong>l&#39;audio può\nessere elaborato sui server di Apple o Google</strong>, secondo le loro informative\nsulla privacy. L&#39;app stessa <strong>non registra né archivia audio</strong> — riceve solo\nil testo risultante, che rimane nel campo di inserimento finché non decidi di\ninviarlo.</p>\n<h3>3.4 Segnalazione di contenuti AI</h3>\n<p>Puoi segnalare contenuti AI offensivi o imprecisi direttamente da una\nconversazione (icona della bandierina accanto a un messaggio dell&#39;assistente).\nQuesto apre il <strong>client e-mail del tuo dispositivo</strong> con un messaggio\nprecompilato indirizzato a <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong>, contenente il motivo che\nhai selezionato e un estratto del messaggio segnalato (fino a 500 caratteri).\nNon viene inviato nulla finché non spedisci tu stesso l&#39;e-mail — l&#39;app non\ncomunica con alcuna API di segnalazione.</p>\n<h3>3.5 Link di donazione esterni</h3>\n<p>La schermata &quot;Sostieni lo sviluppo&quot; contiene link facoltativi a <strong>Ko-fi</strong> e\n<strong>Buy Me a Coffee</strong>. Toccandoli si apre il sito esterno nel tuo browser;\nqualsiasi pagamento avviene interamente su quei siti di terze parti, secondo\nle loro informative sulla privacy. L&#39;app stessa non elabora alcun pagamento e\nnon riceve alcun dato al riguardo.</p>\n<h3>3.6 Cosa l&#39;app <strong>NON</strong> invia</h3>\n<ul>\n<li>Telemetria (dati analitici)</li>\n<li>Segnalazioni di arresti anomali (nessun Sentry, Crashlytics, Bugsnag…)</li>\n<li>Notifiche push (l&#39;app non le utilizza)</li>\n<li>Posizione geografica</li>\n<li>Contatti, calendario, foto senza la tua selezione esplicita</li>\n<li>Conversazioni a qualsiasi server diverso dal provider che hai scelto</li>\n</ul>\n<hr>\n<h2>4. Autorizzazioni del dispositivo</h2>\n<p>L&#39;app richiede <strong>autorizzazioni esplicite</strong> al momento dell&#39;utilizzo per:</p>\n<table>\n<thead>\n<tr>\n<th>Autorizzazione</th>\n<th>Quando viene richiesta</th>\n<th>Perché</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Libreria foto</strong></td>\n<td>Solo quando premi &quot;Galleria&quot; per un allegato</td>\n<td>Per scegliere un&#39;immagine</td>\n</tr>\n<tr>\n<td><strong>Fotocamera</strong></td>\n<td>Solo quando premi &quot;Foto&quot; per un allegato</td>\n<td>Per scattare una foto</td>\n</tr>\n<tr>\n<td><strong>Microfono</strong></td>\n<td>Solo quando premi per la prima volta l&#39;icona del microfono</td>\n<td>Input vocale (vedi 3.3 — elaborato dal servizio vocale di sistema)</td>\n</tr>\n<tr>\n<td><strong>Internet</strong></td>\n<td>Implicita</td>\n<td>Invio ai provider</td>\n</tr>\n</tbody></table>\n<p>La finestra di dialogo di sistema iOS / Android è granulare — puoi rifiutare e\nl&#39;app continua a funzionare (solo senza quella funzionalità).</p>\n<hr>\n<h2>5. Trasparenza sull&#39;AI</h2>\n<p>Al primo avvio l&#39;app mostra un avviso chiaro che <strong>stai conversando con\nun&#39;intelligenza artificiale</strong>, in linea con i requisiti di trasparenza\ndell&#39;EU AI Act. Le risposte generate dall&#39;AI possono essere imprecise\n(&quot;allucinazioni&quot;) — verifica le informazioni importanti in modo indipendente.\nLa tua conferma di questo avviso viene memorizzata solo localmente sul tuo\ndispositivo.</p>\n<hr>\n<h2>6. I tuoi diritti (GDPR)</h2>\n<p>Sebbene l&#39;app <strong>non conservi dati nel cloud</strong>, ecco i tuoi diritti ai sensi del\nRegolamento generale sulla protezione dei dati:</p>\n<ul>\n<li><strong>Diritto di accesso</strong> — tutto ciò che l&#39;app memorizza si trova nella sandbox\ndel tuo dispositivo ed è visibile nell&#39;interfaccia (conversazioni, chiavi,\nimpostazioni).</li>\n<li><strong>Diritto di rettifica</strong> — tutte le voci possono essere modificate nelle\nImpostazioni.</li>\n<li><strong>Diritto alla cancellazione</strong> — usa &quot;Elimina tutte le conversazioni&quot; nelle\nImpostazioni ed elimina le chiavi singolarmente. La disinstallazione dell&#39;app\nelimina tutto.</li>\n<li><strong>Diritto alla limitazione del trattamento</strong> — disabilita l&#39;invio eliminando\nla chiave; senza chiave l&#39;app non invia nulla.</li>\n<li><strong>Diritto alla portabilità dei dati</strong> — l&#39;esportazione non è ancora implementata.\nSoluzione alternativa: tieni premuto un messaggio →\nCopia. (L&#39;esportazione in blocco è prevista per le versioni future.)</li>\n<li><strong>Diritto di opposizione</strong> — contattaci (vedi sotto).</li>\n<li><strong>Diritto di revoca del consenso</strong> — tutte le autorizzazioni possono essere\nrevocate nelle impostazioni di sistema del dispositivo.</li>\n</ul>\n<p>Per i reclami puoi contattare l&#39;autorità di controllo competente per la\nprotezione dei dati del tuo paese.</p>\n<hr>\n<h2>7. Minori</h2>\n<p>L&#39;app non è destinata ai minori di 13 anni. I modelli AI possono generare\ncontenuti inappropriati per i minori (i provider dispongono di propri controlli,\nma non sono perfetti). I genitori sono responsabili della supervisione dell&#39;uso.</p>\n<hr>\n<h2>8. Modifiche all&#39;informativa</h2>\n<p>L&#39;informativa può cambiare con una nuova versione dell&#39;app. In caso di modifiche\nsignificative (es. aggiunta di un nuovo servizio di terze parti), aggiorneremo\nla data &quot;In vigore dal&quot; in cima e indicheremo il motivo nelle note di rilascio\ndella nuova versione.</p>\n<p>Questa informativa è disponibile in più lingue all&#39;interno dell&#39;app; in caso\ndi discrepanze, <strong>prevale la versione inglese</strong>.</p>\n<hr>\n<h2>Contatto</h2>\n<p>Per qualsiasi domanda su questa informativa:</p>\n<ul>\n<li>E-mail: <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong></li>\n<li>Issue GitHub: vedi il repository</li>\n</ul>\n","es":"<h1>Política de privacidad — Frend AI</h1>\n<p>Esta política describe <strong>qué datos se procesan</strong> cuando usas la app Frend AI\n(versiones móvil y web). La app está diseñada bajo el principio de\n<strong>privacidad por diseño</strong> — sin backend propio, sin registro, sin telemetría.</p>\n<hr>\n<h2>1. Resumen rápido</h2>\n<table>\n<thead>\n<tr>\n<th>Pregunta</th>\n<th>Respuesta</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>¿De quién son los datos?</td>\n<td><strong>Tuyos.</strong> Todo permanece en tu dispositivo.</td>\n</tr>\n<tr>\n<td>¿Se envían a algún lado?</td>\n<td>Solo <strong>directamente a los proveedores cuyas claves hayas introducido</strong> (OpenAI, Anthropic, …).</td>\n</tr>\n<tr>\n<td>¿Existe un backend?</td>\n<td><strong>No.</strong></td>\n</tr>\n<tr>\n<td>¿Existe alguna herramienta de análisis?</td>\n<td><strong>No.</strong></td>\n</tr>\n<tr>\n<td>¿Existe un sistema de informes de fallos?</td>\n<td><strong>No.</strong></td>\n</tr>\n<tr>\n<td>¿Anuncios o compras en la app?</td>\n<td><strong>No.</strong> La app es libre de anuncios y no tiene compras en la app. Puedes apoyar el desarrollo mediante enlaces de donación externos opcionales (Ko-fi, Buy Me a Coffee).</td>\n</tr>\n<tr>\n<td>¿Puedo eliminar mis datos?</td>\n<td>Sí, con un solo toque en Ajustes.</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>2. Qué almacena la app localmente (en tu dispositivo)</h2>\n<table>\n<thead>\n<tr>\n<th>Datos</th>\n<th>Dónde</th>\n<th>Por qué</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Claves API de los proveedores</td>\n<td>iOS Keychain / Android Keystore (móvil), localStorage (web)</td>\n<td>Necesarias para enviar solicitudes a los proveedores</td>\n</tr>\n<tr>\n<td>Conversaciones (chats)</td>\n<td>AsyncStorage en el sandbox de la app</td>\n<td>Tu historial, búsqueda, chats fijados</td>\n</tr>\n<tr>\n<td>Adjuntos (imágenes, PDFs, audio)</td>\n<td>Directorio de documentos de la app</td>\n<td>Sobreviven al reinicio/reinstalación (hasta la desinstalación)</td>\n</tr>\n<tr>\n<td>Ajustes</td>\n<td>AsyncStorage</td>\n<td>Modelo predeterminado, tema, idioma de la app, nombre, prompt del sistema, accesos directos</td>\n</tr>\n<tr>\n<td>Confirmación del aviso de IA</td>\n<td>AsyncStorage</td>\n<td>Recuerda que has visto el aviso &quot;estás hablando con una IA&quot; (transparencia conforme al EU AI Act)</td>\n</tr>\n<tr>\n<td>Caché del catálogo de modelos</td>\n<td>AsyncStorage</td>\n<td>Inicio más rápido (sin llamada a /models en cada arranque)</td>\n</tr>\n<tr>\n<td>Metadatos de estado por clave</td>\n<td>junto a la propia clave</td>\n<td>Cooldown, modelos bloqueados, último error</td>\n</tr>\n<tr>\n<td>Consumo de tokens y coste estimado</td>\n<td>dentro de cada chat</td>\n<td>Se muestran en la hoja de información del chat; calculados localmente</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><strong>Ninguno de estos datos abandona jamás tu dispositivo</strong> — salvo cuando pulsas\n&quot;Enviar&quot; y el contenido del mensaje + la clave se transmiten directamente al\nservidor del proveedor.</p>\n</blockquote>\n<hr>\n<h2>3. Qué <strong>envía</strong> la app</h2>\n<h3>3.1 Proveedores de modelos de IA</h3>\n<p>Cuando envías un mensaje, la app realiza una <strong>solicitud HTTPS POST</strong> al\nproveedor que hayas elegido (p. ej. <a href=\"https://api.openai.com/v1/chat/completions\">https://api.openai.com/v1/chat/completions</a>).\nLa solicitud contiene:</p>\n<ul>\n<li><strong>Tu mensaje</strong> (texto + adjuntos, si los hay — imágenes, PDFs, audio)</li>\n<li><strong>El historial de la conversación</strong> (solo los mensajes de <strong>ese</strong> chat)</li>\n<li><strong>El prompt del sistema</strong> (si has configurado uno) y tu nombre (si lo has introducido)</li>\n<li><strong>La clave API</strong> (mediante cabecera, parámetro de consulta o Bearer según el proveedor)</li>\n</ul>\n<p>Lo que el proveedor hace con esos datos lo define <strong>su política de privacidad</strong>.\nTe recomendamos leerla antes de usar la app:</p>\n<ul>\n<li>OpenAI — <a href=\"https://openai.com/policies/privacy-policy\">https://openai.com/policies/privacy-policy</a></li>\n<li>Anthropic — <a href=\"https://www.anthropic.com/legal/privacy\">https://www.anthropic.com/legal/privacy</a></li>\n<li>Google AI — <a href=\"https://policies.google.com/privacy\">https://policies.google.com/privacy</a></li>\n<li>xAI — <a href=\"https://x.ai/legal/privacy-policy\">https://x.ai/legal/privacy-policy</a></li>\n<li>DeepSeek — <a href=\"https://platform.deepseek.com/privacy-policy\">https://platform.deepseek.com/privacy-policy</a></li>\n<li>Groq — <a href=\"https://groq.com/privacy-policy/\">https://groq.com/privacy-policy/</a></li>\n<li>OpenRouter — <a href=\"https://openrouter.ai/privacy\">https://openrouter.ai/privacy</a></li>\n</ul>\n<blockquote>\n<p>💡 La mayoría de los proveedores <strong>no utilizan las solicitudes API para\nentrenar modelos</strong> (a diferencia de los chats web gratuitos). Aun así,\nverifica el estado actual de sus condiciones.</p>\n</blockquote>\n<h3>3.2 Listado de modelos</h3>\n<p>Al iniciar la app (y cuando pulsas &quot;Actualizar&quot; en Ajustes), la app envía una\nsolicitud al endpoint /models de cada proveedor para el que tengas una clave.\nEs solo un <strong>listado</strong> (sin mensajes), pero la clave se envía para autenticarse.</p>\n<h3>3.3 Entrada de voz (reconocimiento de voz)</h3>\n<p>Cuando usas el micrófono, la conversión de voz a texto la realiza el\n<strong>servicio de voz del sistema de tu dispositivo</strong> — Apple (SFSpeechRecognizer)\nen iOS, el reconocimiento de voz de Google en Android, o el motor de voz de tu\nnavegador en la web. Según el dispositivo y el idioma, <strong>el audio puede\nprocesarse en los servidores de Apple o Google</strong>, conforme a sus políticas de\nprivacidad. La propia app <strong>no graba ni almacena audio</strong> — solo recibe el\ntexto resultante, que permanece en el campo de mensaje hasta que decidas\nenviarlo.</p>\n<h3>3.4 Denuncia de contenido de IA</h3>\n<p>Puedes denunciar contenido de IA ofensivo o inexacto directamente desde una\nconversación (icono de bandera junto a un mensaje del asistente). Esto abre el\n<strong>cliente de correo de tu dispositivo</strong> con un mensaje prerrellenado dirigido\na <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong>, que contiene el motivo que hayas seleccionado y un\nextracto del mensaje denunciado (hasta 500 caracteres). No se envía nada hasta\nque tú mismo envíes el correo — la app no se comunica con ninguna API de\ndenuncias.</p>\n<h3>3.5 Enlaces de donación externos</h3>\n<p>La pantalla &quot;Apoyar el desarrollo&quot; contiene enlaces opcionales a <strong>Ko-fi</strong> y\n<strong>Buy Me a Coffee</strong>. Al pulsarlos se abre el sitio externo en tu navegador;\ncualquier pago se realiza por completo en esos sitios de terceros conforme a\nsus propias políticas de privacidad. La propia app no procesa ningún pago y no\nrecibe datos al respecto.</p>\n<h3>3.6 Qué <strong>NO</strong> envía la app</h3>\n<ul>\n<li>Telemetría (datos de análisis)</li>\n<li>Informes de fallos (sin Sentry, Crashlytics, Bugsnag…)</li>\n<li>Notificaciones push (la app no las utiliza)</li>\n<li>Ubicación</li>\n<li>Contactos, calendario, fotos sin tu selección explícita</li>\n<li>Conversaciones a ningún servidor que no sea el proveedor que hayas elegido</li>\n</ul>\n<hr>\n<h2>4. Permisos del dispositivo</h2>\n<p>La app solicitará <strong>permisos explícitos</strong> en el momento de uso para:</p>\n<table>\n<thead>\n<tr>\n<th>Permiso</th>\n<th>Cuándo se solicita</th>\n<th>Por qué</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Biblioteca de fotos</strong></td>\n<td>Solo cuando pulsas &quot;Galería&quot; para un adjunto</td>\n<td>Para elegir una imagen</td>\n</tr>\n<tr>\n<td><strong>Cámara</strong></td>\n<td>Solo cuando pulsas &quot;Foto&quot; para un adjunto</td>\n<td>Para hacer una foto</td>\n</tr>\n<tr>\n<td><strong>Micrófono</strong></td>\n<td>Solo la primera vez que pulsas el icono del micrófono</td>\n<td>Entrada de voz (ver 3.3 — procesada por el servicio de voz del sistema)</td>\n</tr>\n<tr>\n<td><strong>Internet</strong></td>\n<td>Implícito</td>\n<td>Envío a los proveedores</td>\n</tr>\n</tbody></table>\n<p>El cuadro de diálogo del sistema iOS / Android es granular — puedes rechazar y\nla app sigue funcionando (solo sin esa funcionalidad).</p>\n<hr>\n<h2>5. Transparencia sobre la IA</h2>\n<p>En el primer arranque la app muestra un aviso claro de que <strong>estás conversando\ncon una inteligencia artificial</strong>, en línea con los requisitos de\ntransparencia del EU AI Act. Las respuestas generadas por IA pueden ser\ninexactas (&quot;alucinaciones&quot;) — verifica la información importante de forma\nindependiente. Tu confirmación de este aviso se guarda únicamente de forma\nlocal en tu dispositivo.</p>\n<hr>\n<h2>6. Tus derechos (RGPD)</h2>\n<p>Aunque la app <strong>no guarda datos en la nube</strong>, estos son tus derechos conforme al\nReglamento General de Protección de Datos:</p>\n<ul>\n<li><strong>Derecho de acceso</strong> — todo lo que la app almacena se encuentra en el sandbox\nde tu dispositivo y es visible en la interfaz (conversaciones, claves, ajustes).</li>\n<li><strong>Derecho de rectificación</strong> — todas las entradas se pueden modificar en\nAjustes.</li>\n<li><strong>Derecho de supresión</strong> — usa &quot;Eliminar todas las conversaciones&quot; en Ajustes\ny elimina las claves de forma individual. Desinstalar la app borra todo.</li>\n<li><strong>Derecho a la limitación del tratamiento</strong> — deshabilita el envío eliminando\nla clave; sin clave la app no envía nada.</li>\n<li><strong>Derecho a la portabilidad de los datos</strong> — la exportación no está\nimplementada aún. Alternativa: mantén pulsado un mensaje →\nCopiar. (La exportación masiva está prevista para futuras versiones.)</li>\n<li><strong>Derecho de oposición</strong> — contáctanos (ver abajo).</li>\n<li><strong>Derecho a retirar el consentimiento</strong> — todos los permisos pueden revocarse\nen los ajustes del sistema del dispositivo.</li>\n</ul>\n<p>Para reclamaciones puedes contactar con la autoridad de control competente en\nmateria de protección de datos de tu país.</p>\n<hr>\n<h2>7. Menores</h2>\n<p>La app no está destinada a menores de 13 años. Los modelos de IA pueden generar\ncontenido inapropiado para menores (los proveedores disponen de sus propios\ncontroles, aunque no son perfectos). Los padres o tutores son responsables de\nsupervisar el uso.</p>\n<hr>\n<h2>8. Cambios en la política</h2>\n<p>La política puede cambiar con una nueva versión de la app. Ante cambios\nsignificativos (p. ej. incorporación de un nuevo servicio de terceros),\nactualizaremos la fecha &quot;En vigor desde&quot; en la parte superior e indicaremos el\nmotivo en las notas de la nueva versión.</p>\n<p>Esta política está disponible en varios idiomas dentro de la app; en caso de\ndiscrepancias, <strong>prevalece la versión en inglés</strong>.</p>\n<hr>\n<h2>Contacto</h2>\n<p>Para cualquier consulta sobre esta política:</p>\n<ul>\n<li>Correo electrónico: <strong><a href=\"mailto:bearvil.co@gmail.com\">bearvil.co@gmail.com</a></strong></li>\n<li>Issue en GitHub: consulta el repositorio</li>\n</ul>\n","pt":"<h1>Política de privacidade — Frend AI</h1>\n<p>Esta política descreve <strong>quais dados são processados</strong> quando você usa o\naplicativo Frend AI (versões móvel e web). O aplicativo foi concebido com\nbase no princípio da <strong>privacidade por design</strong> — sem backend próprio, sem\nlogin, sem telemetria.</p>\n<hr>\n<h2>1. Resumo rápido</h2>\n<table>\n<thead>\n<tr>\n<th>Pergunta</th>\n<th>Resposta</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>De quem são os dados?</td>\n<td><strong>Seus.</strong> Tudo fica no seu dispositivo.</td>\n</tr>\n<tr>\n<td>Você os envia para algum lugar?</td>\n<td>Apenas <strong>diretamente para os provedores cujas chaves você cadastrou</strong> (OpenAI, Anthropic, …).</td>\n</tr>\n<tr>\n<td>Você tem um backend?</td>\n<td><strong>Não.</strong></td>\n</tr>\n<tr>\n<td>Você tem análises (analytics)?</td>\n<td><strong>Não.</strong></td>\n</tr>\n<tr>\n<td>Você tem um relatório de falhas?</td>\n<td><strong>Não.</strong></td>\n</tr>\n<tr>\n<td>Anúncios ou compras no aplicativo?</td>\n<td><strong>Não.</strong> O app é livre de anúncios e não tem compras no aplicativo. Você pode apoiar o desenvolvimento por meio de links de doação externos opcionais (Ko-fi, Buy Me a Coffee).</td>\n</tr>\n<tr>\n<td>Posso excluir meus dados?</td>\n<td>Sim, com um toque em Configurações.</td>\n</tr>\n</tbody></table>\n<hr>\n<h2>2. O que o aplicativo armazena localmente (no seu dispositivo)</h2>\n<table>\n<thead>\n<tr>\n<th>Dado</th>\n<th>Onde</th>\n<th>Por quê</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Chaves de API dos provedores</td>\n<td>iOS Keychain / Android Keystore (móvel), localStorage (web)</td>\n<td>Necessário para enviar requisições aos provedores</td>\n</tr>\n<tr>\n<td>Conversas (chats)</td>\n<td>AsyncStorage no sandbox do aplicativo</td>\n<td>Seu histórico, pesquisa, favoritos</td>\n</tr>\n<tr>\n<td>Anexos (imagens, PDFs, áudio)</td>\n<td>Diretório de documentos do aplicativo</td>\n<td>Para sobreviver a reinicializações/reinstalações (até a desinstalação)</td>\n</tr>\n<tr>\n<td>Configurações</td>\n<td>AsyncStorage</td>\n<td>Modelo padrão, tema, idioma do aplicativo, nome, prompt de sistema, atalhos</td>\n</tr>\n<tr>\n<td>Confirmação do aviso de IA</td>\n<td>AsyncStorage</td>\n<td>Lembra que você viu o aviso &quot;você está conversando com uma IA&quot; (transparência do EU AI Act)</td>\n</tr>\n<tr>\n<td>Cache do catálogo de modelos</td>\n<td>AsyncStorage</td>\n<td>Inicialização mais rápida (sem consultar /models a cada vez)</td>\n</tr>\n<tr>\n<td>Metadados de saúde por chave</td>\n<td>junto à própria chave</td>\n<td>Cooldown, modelos bloqueados, último erro</td>\n</tr>\n<tr>\n<td>Uso de tokens e custo estimado</td>\n<td>dentro de cada conversa</td>\n<td>Exibido na ficha de informações do chat; calculado localmente</td>\n</tr>\n</tbody></table>\n<blockquote>\n<p><strong>Nenhum desses dados sai do seu dispositivo</strong> — exceto quando você toca\nem &quot;Enviar&quot; e o conteúdo da mensagem + chave vão diretamente para o servidor\ndo provedor.</p>\n</blockquote>\n<hr>\n<h2>3. O que o aplicativo <strong>envia</strong> para fora</h2>\n<h3>3.1 Provedores de modelos de IA</h3>\n<p>Quando você envia uma mensagem, o aplicativo faz uma <strong>requisição HTTPS POST</strong>\npara o provedor que você escolheu (por ex. <a href=\"https://api.openai.com/v1/chat/completions\">https://api.openai.com/v1/chat/completions</a>).\nA requisição contém:</p>\n<ul>\n<li><strong>Sua mensagem</strong> (texto + anexos, se houver — imagens, PDFs, áudio)</li>\n<li><strong>Histórico da conversa</strong> (apenas as mensagens <strong>daquele</strong> chat)</li>\n<li><strong>Prompt de sistema</strong> (se você tiver definido um) e seu nome (se você o informou)</li>\n<li><strong>Chave de API</strong> (via header, query ou Bearer, dependendo do provedor)</li>\n</ul>\n<p>O que o provedor faz com esses dados é definido pela <strong>política de privacidade\ndele</strong>. Leia antes de usar:</p>\n<ul>\n<li>OpenAI — <a href=\"https://openai.com/policies/privacy-policy\">https://openai.com/policies/privacy-policy</a></li>\n<li>Anthropic — <a href=\"https://www.anthropic.com/legal/privacy\">https://www.anthropic.com/legal/privacy</a></li>\n<li>Google AI — <a href=\"https://policies.google.com/privacy\">https://policies.google.com/privacy</a></li>\n<li>xAI — <a href=\"https://x.ai/legal/privacy-policy\">https://x.ai/legal/privacy-policy</a></li>\n<li>DeepSeek — <a href=\"https://platform.deepseek.com/privacy-policy\">https://platform.deepseek.com/privacy-policy</a></li>\n<li>Groq — <a href=\"https://groq.com/privacy-policy/\">https://groq.com/privacy-policy/</a></li>\n<li>OpenRouter — <a href=\"https://openrouter.ai/privacy\">https://openrouter.ai/privacy</a></li>\n</ul>\n<blockquote>\n<p>💡 A maioria dos provedores <strong>não usa requisições de API para treinar\nmodelos</strong> (ao contrário dos chats web gratuitos). Mesmo assim, verifique\no estado atual dos termos deles.</p>\n</blockquote>\n<h3>3.2 Listagem de modelos</h3>\n<p>Na inicialização do aplicativo (e quando você pressiona &quot;Atualizar&quot; em\nConfigurações), o aplicativo envia uma requisição ao endpoint /models de\ncada provedor para o qual você possui uma chave. Trata-se apenas de uma\n<strong>listagem</strong> (sem mensagens), mas a
