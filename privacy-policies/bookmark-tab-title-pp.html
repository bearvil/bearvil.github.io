<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmark-Tab Title — Privacy Policy</title>
<meta name="description" content="Privacy Policy for the Bookmark-Tab Title browser extension. No data collected, no network requests — your bookmarks never leave your browser.">
<link rel="icon" type="image/png" href="/privacy-policies/bookmark-tab-title-icon.png">
<style>
  /* Bookmark-Tab Title palette (matches the extension icon). Standalone page — exception to the site's CSS system.
     System fonts only, so this page makes no third-party requests. */
  :root {
    --bg-0: #002E34; --bg-1: #083F47; --bg-2: #144E4E;
    --paper: #F7F8FA; --text: #142224; --muted: #4A5B5D;
    --accent: #0E6E66; --accent-soft: rgba(14, 110, 102, 0.10); --line: rgba(20, 34, 36, 0.10); --sky: #5EEAD4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg-0) 0%, var(--bg-1) 48%, var(--bg-2) 100%) fixed;
    min-height: 100vh; color: var(--text); padding: 24px 16px 64px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 24px 0 22px; color: var(--paper); }
  .logo { width: 76px; height: 76px; margin: 0 auto; display: block; filter: drop-shadow(0 10px 22px rgba(0,0,0,.3)); }
  h1 { font-size: 32px; font-weight: 800; margin-top: 14px; letter-spacing: -0.5px; }
  h1 span { color: var(--sky); }
  .subtitle { font-weight: 700; font-size: 14px; letter-spacing: 0.4px; color: rgba(247,248,250,.82); margin-top: 4px; }
  .lang-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
  .lang-btn {
    font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    color: rgba(247,248,250,.9); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
  }
  .lang-btn.active { color: var(--sky); border-color: var(--sky); background: rgba(94,234,212,.14); }
  .card { background: var(--paper); border-radius: 22px; padding: 28px 24px; box-shadow: 0 18px 50px rgba(0,0,0,.28); line-height: 1.6; }
  .tldr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .badge { text-align: center; padding: 12px 6px; border-radius: 16px; background: var(--accent-soft); border: 1px solid var(--line); }
  .badge b { display: block; font-size: 15px; color: var(--accent); }
  .badge span { font-size: 12px; font-weight: 700; color: var(--muted); }
  .short { padding: 14px 16px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
  h2 { font-size: 19px; font-weight: 800; margin: 24px 0 8px; color: var(--text); }
  p, li { color: var(--muted); font-size: 15.5px; }
  p + p { margin-top: 8px; }
  ul { padding-left: 20px; margin-top: 6px; }
  li { margin: 4px 0; }
  strong { color: var(--text); }
  code { font-size: 14px; background: var(--accent-soft); padding: 1px 5px; border-radius: 6px; }
  a { color: var(--accent); font-weight: 700; }
  .contact { padding: 14px 16px; border-radius: 16px; background: var(--accent-soft); border: 1px solid var(--line); }
  .updated, footer { text-align: center; color: rgba(247,248,250,.75); font-size: 13px; margin-top: 18px; }
  @media (max-width: 420px) { .card { padding: 22px 18px; } .badge { padding: 10px 4px; } .badge span { font-size: 11px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="/privacy-policies/bookmark-tab-title-icon.png" alt="" width="76" height="76">
    <h1>Bookmark-Tab <span>Title</span></h1>
    <p class="subtitle" id="subtitle">Privacy Policy</p>
    <div class="lang-row" role="group" aria-label="Language" id="lang-row"></div>
  </header>

  <main class="card" id="policy-card"><!-- filled by script --></main>

  <p class="updated"><span id="updated-label">Last updated:</span> November 10, 2026 · v1.2</p>
  <footer>Bookmark-Tab Title — Bearvil</footer>
</div>

<script>
  // Languages follow the extension's _locales: en, hr.
  const EMAIL = 'bearvil.info@gmail.com';
  const SOURCE = 'https://github.com/bearvil/bookmark-tab-title';
  const I18N = {
    en: {
      btn: 'English', subtitle: 'Privacy Policy', updated: 'Last updated:',
      badges: [['0', 'data collected'], ['No', 'network requests'], ['No', 'account']],
      short: '<strong>The short version:</strong> Bookmark-Tab Title collects no data. It reads your bookmarks and the address of the open tab only inside your browser, to show the bookmark name as the tab title. Nothing is sent to us or to anyone else.',
      sections: [
        ['About the extension', '<p>Bookmark-Tab Title is a browser extension for Chrome and other Chromium-based browsers. When the page in a tab is one of your bookmarks, the tab shows the name you gave that bookmark instead of the page title.</p>'],
        ['Data we collect', '<p><strong>None.</strong> We (Bearvil) never receive any data from the extension. It has no server, no account, no analytics, no ads and no tracking, and it makes no network requests at all. Its source code is public: <a href="' + SOURCE + '" target="_blank" rel="noopener">github.com/bearvil/bookmark-tab-title</a>.</p>'],
        ['What the extension reads, locally', '<ul><li><strong>Your bookmarks</strong> (names and addresses), to find the bookmark that matches the open page.</li><li><strong>The address of each open tab</strong> and the address its current page was loaded from. After a redirect within the same site (e.g. from <code>example.com</code> to <code>example.com/login</code>) it also keeps the address before the redirect, so the bookmark name still applies.</li></ul><p>All of this stays in your browser. The addresses of the current page load in each tab are kept in the browser\'s session storage, in memory only, and are removed when you close the tab or the browser, or when the extension is updated or removed. Apart from your settings, described below, the extension stores nothing else.</p>'],
        ['Your settings', '<p>For each bookmark you can choose <strong>how far its name reaches</strong>: only its address, the pages under it, pages of its site whose address contains a text you type (for example <code>/u/1/</code> for a second Google account), or the whole site. You choose it in the extension\'s popup, on its settings page or by right-clicking a page. The extension saves only the bookmarks with a wider choice than “only this address”, as their addresses, with the choice and the text you typed, in your browser\'s extension storage. If you use your browser\'s sync, this list is synced with your other devices through your browser account, like your bookmarks themselves. We never receive it.</p><p>For “pages under it” and “the whole site”, the extension also remembers, per tab, the bookmarked addresses the tab visited on its current site, in session storage that is cleared when the tab leaves the site or when you close the tab or the browser.</p>'],
        ['What websites can see', '<p>The extension changes the title of a bookmarked page to your bookmark name. Like any page title, the website open in that tab can read it, and so it can learn that you bookmarked it and what you called it. It could send that to its own server; the extension cannot prevent this. A page from a different site never gets the name, not even after a redirect from your bookmark to another site. If a bookmark name contains something private, keep that in mind.</p>'],
        ['Browser history', '<p>Your browser saves tab titles in its history, so history entries for bookmarked pages show your bookmark names. If you use your browser\'s sync, history is synced to your account with the browser maker, as it always is. The extension itself sends and syncs nothing.</p>'],
        ['Permissions', '<ul><li><strong>Bookmarks</strong> — to read bookmark names and addresses, and to rename or add a bookmark when you do it in the extension\'s popup.</li><li><strong>Access to http and https pages</strong> — to set the title of a bookmarked page; it is needed on every site because any page can be a bookmark.</li><li><strong>Web navigation</strong> — to know the address a page was loaded from, before a redirect, and to notice in-page navigation.</li><li><strong>Scripting</strong> — to start working in tabs that were already open when the extension was installed or updated.</li><li><strong>Context menus</strong> — for the items that choose how far the bookmark name reaches when you right-click a page.</li><li><strong>Storage</strong> — your settings (synced by your browser if you use its sync) and session-only, in-memory storage for the current page load in each tab.</li></ul>'],
        ['Removing the extension', '<p>Remove the extension from your browser\'s extensions page. The browser deletes its settings with it. Tabs that are already open show their own titles again after you reload them. History entries that show bookmark names stay until you clear your browser history.</p>'],
        ['Children', '<p>The extension is not directed at children and collects no data from anyone.</p>'],
        ['Changes to this policy', '<p>If this policy changes, the new version will be published at this address with an updated date.</p>'],
      ],
      contactTitle: 'Contact', contact: 'Questions about privacy? Write to us:',
    },
    hr: {
      btn: 'Hrvatski', subtitle: 'Pravila privatnosti', updated: 'Zadnja izmjena:',
      badges: [['0', 'prikupljenih podataka'], ['Bez', 'mrežnih zahtjeva'], ['Bez', 'računa']],
      short: '<strong>Ukratko:</strong> Bookmark-Tab Title ne prikuplja nikakve podatke. Tvoje bookmarke i adresu otvorenog taba čita samo unutar preglednika, kako bi naziv bookmarka prikazao kao naslov taba. Ništa se ne šalje nama ni bilo kome drugome.',
      sections: [
        ['O extensionu', '<p>Bookmark-Tab Title je proširenje za Chrome i druge preglednike na Chromiumu. Kad je stranica u tabu jedan od tvojih bookmarka, tab pokazuje naziv koji si dao tom bookmarku umjesto naslova stranice.</p>'],
        ['Podaci koje prikupljamo', '<p><strong>Nikakvi.</strong> Mi (Bearvil) ne primamo nikakve podatke iz extensiona. Nema poslužitelj, račun, analitiku, oglase ni praćenje i ne šalje nikakve mrežne zahtjeve. Izvorni kod je javan: <a href="' + SOURCE + '" target="_blank" rel="noopener">github.com/bearvil/bookmark-tab-title</a>.</p>'],
        ['Što extension čita, lokalno', '<ul><li><strong>Tvoje bookmarke</strong> (nazive i adrese), da nađe bookmark koji odgovara otvorenoj stranici.</li><li><strong>Adresu svakog otvorenog taba</strong> i adresu s koje je učitana trenutna stranica. Nakon preusmjeravanja unutar istog sitea (npr. s <code>example.com</code> na <code>example.com/login</code>) pamti i adresu prije preusmjeravanja, da naziv bookmarka i dalje vrijedi.</li></ul><p>Sve to ostaje u pregledniku. Adrese trenutnog učitavanja u svakom tabu čuvaju se u spremištu sesije preglednika, samo u memoriji, i brišu se kad zatvoriš tab ili preglednik, te kad se extension ažurira ili ukloni. Osim tvojih postavki, opisanih niže, extension ništa drugo ne sprema.</p>'],
        ['Tvoje postavke', '<p>Za svaki bookmark možeš odabrati <strong>dokle seže njegov naziv</strong>: samo njegova adresa, stranice ispod nje, stranice njegovog hosta čija adresa sadrži tekst koji upišeš (npr. <code>/u/1/</code> za drugi Google račun) ili cijeli host. Biraš u izborniku proširenja, na njegovoj stranici s postavkama ili desnim klikom na stranicu. Extension sprema samo bookmarke sa širim izborom od „samo ova adresa”, kao njihove adrese, s izborom i upisanim tekstom, u spremište proširenja u pregledniku. Ako koristiš sinkronizaciju preglednika, taj se popis sinkronizira s tvojim drugim uređajima preko tvog računa preglednika, kao i sami bookmarki. Mi ga nikad ne primamo.</p><p>Za „stranice ispod” i „cijeli host” extension za svaki tab pamti i adrese bookmarka koje je tab posjetio na trenutnom hostu, u spremištu sesije koje se briše kad tab ode s hosta ili kad zatvoriš tab ili preglednik.</p>'],
        ['Što vide web-stranice', '<p>Extension mijenja naslov stranice koja je bookmark u tvoj naziv bookmarka. Kao i svaki naslov stranice, može ga pročitati web-stranica otvorena u tom tabu, pa tako saznati da si je spremio i kako si je nazvao. Mogla bi to poslati svom poslužitelju; extension to ne može spriječiti. Stranica s drugog sitea nikad ne dobiva naziv, ni nakon preusmjeravanja s tvog bookmarka na drugi site. Ako naziv bookmarka sadrži nešto privatno, imaj to na umu.</p>'],
        ['Povijest preglednika', '<p>Preglednik u povijest sprema naslove tabova, pa unosi za stranice iz bookmarka pokazuju tvoje nazive bookmarka. Ako koristiš sinkronizaciju preglednika, povijest se kao i inače sinkronizira na tvoj račun kod proizvođača preglednika. Extension sam ništa ne šalje i ne sinkronizira.</p>'],
        ['Dozvole', '<ul><li><strong>Bookmarki</strong> — za čitanje naziva i adresa bookmarka te za preimenovanje ili dodavanje bookmarka kad to napraviš u izborniku proširenja.</li><li><strong>Pristup http i https stranicama</strong> — za postavljanje naslova stranice koja je bookmark; treba na svim stranicama jer svaka stranica može biti bookmark.</li><li><strong>Web navigacija</strong> — za adresu s koje je stranica učitana, prije preusmjeravanja, i za navigaciju unutar stranice.</li><li><strong>Skriptiranje</strong> — da extension proradi i u tabovima koji su bili otvoreni prije instalacije ili ažuriranja.</li><li><strong>Kontekstni izbornici</strong> — za stavke kojima biraš dokle seže naziv bookmarka kad desnom tipkom klikneš na stranicu.</li><li><strong>Spremište</strong> — tvoje postavke (sinkronizira ih preglednik ako koristiš njegovu sinkronizaciju) i spremište sesije, samo u memoriji, za trenutno učitavanje u svakom tabu.</li></ul>'],
        ['Uklanjanje extensiona', '<p>Ukloni extension na stranici s proširenjima u pregledniku. Preglednik s njim briše i njegove postavke. Već otvoreni tabovi vraćaju svoje naslove kad ih ponovno učitaš. Unosi u povijesti s nazivima bookmarka ostaju dok ne obrišeš povijest preglednika.</p>'],
        ['Djeca', '<p>Extension nije namijenjen djeci i ni od koga ne prikuplja podatke.</p>'],
        ['Izmjene ovih pravila', '<p>Ako se pravila promijene, nova verzija bit će objavljena na ovoj adresi s novim datumom.</p>'],
      ],
      contactTitle: 'Kontakt', contact: 'Pitanja o privatnosti? Piši nam:',
    },
  };
  const LANG_ORDER = ['en', 'hr'];
  const card = document.getElementById('policy-card');
  const langRow = document.getElementById('lang-row');

  LANG_ORDER.forEach((key) => {
    const b = document.createElement('button');
    b.className = 'lang-btn';
    b.dataset.lang = key;
    b.textContent = I18N[key].btn;
    b.addEventListener('click', () => setLang(key));
    langRow.appendChild(b);
  });

  function render(lang) {
    const d = I18N[lang];
    let html = '<div class="tldr">';
    d.badges.forEach(([big, cap]) => { html += `<div class="badge"><b>${big}</b><span>${cap}</span></div>`; });
    html += `</div><p class="short">${d.short}</p>`;
    d.sections.forEach(([title, body]) => { html += `<h2>${title}</h2>${body}`; });
    html += `<h2>${d.contactTitle}</h2><div class="contact"><p>${d.contact}<br><a href="mailto:${EMAIL}">${EMAIL}</a></p></div>`;
    card.innerHTML = html;
  }

  function setLang(lang) {
    if (!I18N[lang]) lang = 'en';
    render(lang);
    document.getElementById('subtitle').textContent = I18N[lang].subtitle;
    document.getElementById('updated-label').textContent = I18N[lang].updated;
    document.querySelectorAll('.lang-btn').forEach((b) => b.classList.toggle('active', b.dataset.lang === lang));
    document.documentElement.lang = lang;
  }

  const nav = (navigator.language || 'en').toLowerCase().slice(0, 2);
  setLang(LANG_ORDER.includes(nav) ? nav : 'en');
</script>
</body>
</html>
