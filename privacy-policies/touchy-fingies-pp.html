<style>
  :root {
    --bg: #0b1d33;
    --bg2: #102542;
    --card: #fdfdff;
    --ink: #0b1d33;
    --muted: #7a8699;
    --body: #5a6675;
    --teal: #118ab2;
    --green: #06d6a0;
    --yellow: #ffd166;
    --pink: #ef476f;
    --purple: #9b5de5;
    --soft: #eff6fb;
    --line: #eef1f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #0b1d33 0%, #1a1b3a 45%, #2a1b4d 100%);
    min-height: 100vh;
    color: var(--ink);
    padding: 24px 16px 64px;
    position: relative;
    overflow-x: hidden;
  }
  /* floating emoji background, like the smash surface */
  .float {
    position: fixed;
    font-size: 32px;
    opacity: 0.18;
    animation: drift 14s ease-in-out infinite;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-24px) rotate(8deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .float { animation: none; }
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  header { text-align: center; padding: 28px 0 24px; }
  .logo {
    font-size: 56px;
    line-height: 1;
    display: inline-block;
    animation: pop 2.6s ease-in-out infinite;
  }
  @keyframes pop {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12) rotate(-4deg); }
  }
  h1 {
    color: #fff;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-top: 10px;
  }
  .subtitle {
    color: var(--yellow);
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 6px;
  }
  .lang-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
  }
  .lang-btn {
    border: 2px solid transparent;
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 9px 14px;
    border-radius: 12px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .lang-btn:hover { background: rgba(255,255,255,0.22); }
  .lang-btn.active {
    background: var(--teal);
    border-color: #0b6f93;
  }
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 28px 26px;
    margin-top: 20px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
  }
  .tldr {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 6px;
  }
  .badge {
    flex: 1 1 130px;
    background: var(--soft);
    border-radius: 18px;
    padding: 16px 12px;
    text-align: center;
  }
  .badge .big { font-size: 30px; }
  .badge .cap {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--muted);
  }
  h2 {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
    margin-top: 22px;
  }
  h2 .emoji { font-size: 16px; margin-right: 6px; }
  p, li {
    font-size: 15px;
    line-height: 1.65;
    color: var(--body);
    margin-top: 10px;
  }
  ul { padding-left: 20px; }
  li { margin-top: 6px; }
  strong { color: var(--ink); }
  .highlight {
    background: linear-gradient(180deg, transparent 60%, rgba(6,214,160,0.35) 60%);
    color: var(--ink);
    font-weight: 700;
  }
  .contact-box {
    margin-top: 14px;
    background: var(--soft);
    border-radius: 16px;
    padding: 16px 18px;
  }
  .contact-box a {
    color: var(--teal);
    font-weight: 700;
    text-decoration: none;
  }
  .contact-box a:hover { text-decoration: underline; }
  .updated {
    margin-top: 22px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  footer {
    text-align: center;
    margin-top: 26px;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
  }
  footer .emojis { font-size: 20px; letter-spacing: 6px; }
  [hidden] { display: none !important; }
</style>

        ['📳', '权限', '<p>应用使用的唯一权限是<strong>振动</strong>，用于点击屏幕时的轻柔触觉反馈。可在家长面板中关闭。</p>'],
        ['🗣️', '设备端功能', '<p>较新的功能同样完全在您的设备上运行——从不使用网络：</p><ul><li><strong>朗读字母</strong> — 此可选功能使用设备内置的离线语音（文字转语音）。应用不录制任何内容，也从不使用麦克风。</li><li><strong>设备语言</strong> — 首次启动时，应用会（在设备本机上）读取设备的语言设置，仅用于选择初始语言；您可以随时在家长面板中更改。</li><li><strong>屏幕保持常亮</strong> — 游戏期间通过标准系统功能保持屏幕开启，无需任何特殊权限。</li></ul>'],
        ['🔗', '外部链接', '<p>应用中唯一的链接指向本隐私政策，并在设备浏览器中打开。它位于家长面板中的家长验证（一道简单的算术题）之后，因此儿童不会意外离开应用。应用本身永远不会联网。</p>'],
        ['🧒', '儿童隐私（COPPA / GDPR）', '<p>Touchy Fingies 面向幼儿，并以最简单的方式遵守美国《儿童在线隐私保护法》（COPPA）和欧盟《通用数据保护条例》（GDPR）：<strong>完全不收集任何数据</strong>。永远不会收集儿童或任何人的个人信息。</p>'],
        ['🔁', '政策变更', '<p>如果本政策有任何变更（例如在未来的应用更新中），新版本将发布在同一地址，并在下方更新日期。</p>'],
      ],
      contactTitle: '联系我们',
      contact: '有隐私方面的问题？我们很乐意提供帮助：',
    },
  };

  const LANG_ORDER = ['en', 'hr', 'de', 'es', 'fr', 'it', 'pt', 'ru', 'ja', 'zh'];
  const card = document.getElementById('policy-card');
  const langRow = document.getElementById('lang-row');

  // Build the language buttons.
  LANG_ORDER.forEach((key) => {
    const b = document.createElement('button');
    b.className = 'lang-btn';
    b.dataset.lang = key;
    b.textContent = I18N[key].btn;
    b.addEventListener('click', () => setLang(key));
    langRow.appendChild(b);
  });

  function render(lang) {
    const d = I18N[lang];
    const badgeIcons = ['🚫📊', '🚫📢', '🚫🌐'];
    let html = '<div class="tldr">';
    d.badges.forEach((cap, i) => {
      html += `<div class="badge"><span class="big">${badgeIcons[i]}</span><span class="cap">${cap}</span></div>`;
    });
    html += '</div>';
    html += `<p>${d.short}</p>`;
    d.sections.forEach(([emoji, title, body]) => {
      html += `<h2><span class="emoji">${emoji}</span>${title}</h2>${body}`;
    });
    html += `<h2><span class="emoji">✉️</span>${d.contactTitle}</h2>
      <div class="contact-box"><p style="margin-top:0;">${d.contact}<br>
      <a href="mailto:${EMAIL}">${EMAIL}</a></p></div>`;
    card.innerHTML = html;
  }

  function setLang(lang) {
    if (!I18N[lang]) lang = 'en';
    render(lang);
    document.getElementById('subtitle').textContent = I18N[lang].subtitle;
    document.getElementById('updated-label').textContent = I18N[lang].updated;
    document.querySelectorAll('.lang-btn').forEach((b) =>
      b.classList.toggle('active', b.dataset.lang === lang)
    );
    document.documentElement.lang = lang;
  }

  // Auto-detect the browser language; fall back to English.
  const nav = (navigator.language || 'en').toLowerCase().slice(0, 2);
  setLang(LANG_ORDER.includes(nav) ? nav : 'en');
</script>
</body>
</html>
