<style>
  /* Dicty „Paper” paleta (izvor: dicty/docs/DESIGN.md). Samostalna stranica — iznimka od CSS sustava sitea. */
  :root {
    --ink-0: #122131; --ink-1: #1E3A57; --ink-2: #2B5D8A;
    --paper: #F7F5F0; --paper-2: #ECE6D9; --text: #1B2430; --muted: #4f5b69;
    --accent: #2B5D8A; --accent-soft: rgba(43, 93, 138, 0.10); --line: rgba(27, 36, 48, 0.10); --sky: #8AB8E6;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Nunito, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--ink-0) 0%, var(--ink-1) 48%, var(--ink-2) 100%) fixed;
    min-height: 100vh; color: var(--text); padding: 24px 16px 64px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  header { text-align: center; padding: 24px 0 22px; color: var(--paper); }
  .logo {
    width: 76px; height: 76px; margin: 0 auto; border-radius: 18px; position: relative;
    background: linear-gradient(160deg, #FBFAF6, var(--paper) 55%, #F1ECE2); box-shadow: 0 10px 28px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center; font-family: Lora, Georgia, serif; font-weight: 700; font-size: 44px; color: var(--text);
  }
  .logo::after { content: ''; position: absolute; top: 0; right: 0; width: 20px; height: 20px; border-top-right-radius: 18px;
    background: linear-gradient(225deg, transparent 50%, var(--paper-2) 50%); }
  h1 { font-family: Lora, Georgia, serif; font-size: 34px; margin-top: 14px; letter-spacing: -0.5px; }
  h1 span { color: var(--sky); }
  .subtitle { font-weight: 700; font-size: 14px; letter-spacing: 0.4px; color: rgba(247,245,240,.82); margin-top: 4px; }
  .lang-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
  .lang-btn {
    font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    color: rgba(247,245,240,.9); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
  }
  .lang-btn.active { color: var(--sky); border-color: var(--sky); background: rgba(138,184,230,.14); }
  .card { background: var(--paper); border-radius: 22px; padding: 28px 24px; box-shadow: 0 18px 50px rgba(0,0,0,.28); line-height: 1.6; }
  .tldr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .badge { text-align: center; padding: 12px 6px; border-radius: 16px; background: var(--accent-soft); border: 1px solid var(--line); }
  .badge b { display: block; font-size: 15px; color: var(--accent); }
  .badge span { font-size: 12px; font-weight: 700; color: var(--muted); }
  .short { padding: 14px 16px; border-radius: 16px; background: #fff; border: 1px solid var(--line); }
  h2 { font-family: Lora, Georgia, serif; font-size: 19px; margin: 24px 0 8px; color: var(--text); }
  p, li { color: var(--muted); font-size: 15.5px; }
  p + p { margin-top: 8px; }
  ul { padding-left: 20px; margin-top: 6px; }
  li { margin: 4px 0; }
  strong { color: var(--text); }
  a { color: var(--accent); font-weight: 700; }
  .contact { padding: 14px 16px; border-radius: 16px; background: var(--accent-soft); border: 1px solid var(--line); }
  .updated, footer { text-align: center; color: rgba(247,245,240,.75); font-size: 13px; margin-top: 18px; }
  @media (max-width: 420px) { .card { padding: 22px 18px; } .badge { padding: 10px 4px; } .badge span { font-size: 11px; } }
</style>

      sections: [
        ['About the app', '<p>Dicty is a personal dictionary: you create dictionaries, add words with meanings, pronunciation, examples and notes, and link related words. It works entirely offline.</p>'],
        ['Data we collect', '<p><strong>None.</strong> We (Bearvil) never receive any data from Dicty. The app has no account or sign-in, no analytics, crash-reporting or advertising SDKs, and no server. On Android the app does not even have the internet permission, so it technically cannot send anything.</p>'],
        ['Data stored on your device', '<p>Everything you enter is saved in a database inside the app\'s private storage on your device:</p><ul><li>dictionaries (name, description, type, languages) and words (term, meaning, pronunciation, part of speech, example, notes), links between words, your custom types and items in the trash;</li><li>settings: theme, app language, vibration on/off and the date of your last backup.</li></ul><p>Dicty stores no name, e-mail, location, contacts, device identifiers or advertising ID. In the web version the data is kept in your browser\'s storage for this site and can be removed by the browser.</p>'],

        ['Pronunciation', '<p>Pronouncing a word uses the speech synthesizer built into your device or browser. Dicty itself sends the word nowhere. On the web, Dicty uses only voices that run locally in your browser and does not pronounce the word if no such voice exists. On Android, the speech engine is a separate system app with its own settings and privacy policy.</p>'],
        ['Permissions', '<p>The only permission Dicty uses on Android is <strong>vibration</strong>, for subtle haptic feedback. You can turn it off in Settings.</p>'],

        ['Podaci koje prikupljamo', '<p><strong>Nikakvi.</strong> Mi (Bearvil) ne primamo nikakve podatke iz Dictyja. Aplikacija nema račun ni prijavu, nema SDK-ove za analitiku, prijavu rušenja ni oglase i nema poslužitelj. Na Androidu nema ni dozvolu za internet, pa tehnički ne može ništa poslati.</p>'],

        ['Aussprache', '<p>Die Aussprache nutzt die Sprachausgabe deines Geräts oder Browsers. Dicty selbst sendet das Wort nirgendwohin. Im Web verwendet Dicty nur Stimmen, die lokal im Browser laufen, und spricht nichts aus, wenn keine solche Stimme vorhanden ist. Unter Android ist die Sprachausgabe eine eigene System-App mit eigenen Einstellungen und Datenschutzbestimmungen.</p>'],

        ['Datos en tu dispositivo', '<p>Todo lo que introduces se guarda en una base de datos en el almacenamiento privado de la app:</p><ul><li>diccionarios (nombre, descripción, tipo, idiomas) y palabras (término, significado, pronunciación, categoría, ejemplo, notas), enlaces, tus tipos y los elementos de la papelera;</li><li>ajustes: tema, idioma de la app, vibración y fecha de la última copia.</li></ul><p>Dicty no guarda nombre, correo, ubicación, contactos, identificadores del dispositivo ni ID de publicidad. En la versión web los datos se guardan en el almacenamiento del navegador para este sitio y el navegador puede borrarlos.</p>'],

      short: '<strong>En bref :</strong> Dicty ne collecte aucune donnée personnelle. Pas de compte, de serveur, d’analyse, de publicité ni de suivi. Vos dictionnaires restent sur votre appareil et n’en sortent que si vous exportez vous-même une sauvegarde.',

        ['Données collectées', '<p><strong>Aucune.</strong> Nous (Bearvil) ne recevons aucune donnée de Dicty. L’app n’a ni compte ni connexion, ni SDK d’analyse, de rapport de plantage ou de publicité, ni serveur. Sur Android, elle n’a même pas la permission internet et ne peut donc techniquement rien envoyer.</p>'],
        ['Données sur votre appareil', '<p>Tout ce que vous saisissez est enregistré dans une base de données dans l’espace privé de l’app :</p><ul><li>dictionnaires (nom, description, type, langues) et mots (terme, sens, prononciation, catégorie, exemple, notes), liens, vos types et la corbeille ;</li><li>réglages : thème, langue, vibration et date de la dernière sauvegarde.</li></ul><p>Dicty n’enregistre ni nom, ni e-mail, ni position, ni contacts, ni identifiants d’appareil, ni identifiant publicitaire. Dans la version web, les données sont stockées par le navigateur pour ce site et peuvent être effacées par celui-ci.</p>'],

  const LANG_ORDER = ['en', 'hr', 'de', 'es', 'fr', 'it', 'pt', 'ru', 'ja', 'zh'];
  const card = document.getElementById('policy-card');
  const langRow = document.getElementById('lang-row');

  LANG_ORDER.forEach((key) => {
    const b = document.createElement('button');
    b.className = 'lang-btn';
    b.dataset.lang = key;
    b.textContent = I18N[key].btn;
    b.addEventListener('click', () => setLang(key));
    langRow.appendChild(b);
  });

  function render(lang) {
    const d = I18N[lang];
    let html = '<div class="tldr">';
    d.badges.forEach(([big, cap]) => { html += `<div class="badge"><b>${big}</b><span>${cap}</span></div>`; });
    html += `</div><p class="short">${d.short}</p>`;
    d.sections.forEach(([title, body]) => { html += `<h2>${title}</h2>${body}`; });
    html += `<h2>${d.contactTitle}</h2><div class="contact"><p>${d.contact}<br><a href="mailto:${EMAIL}">${EMAIL}</a></p></div>`;
    card.innerHTML = html;
  }

  function setLang(lang) {
    if (!I18N[lang]) lang = 'en';
    render(lang);
    document.getElementById('subtitle').textContent = I18N[lang].subtitle;
    document.getElementById('updated-label').textContent = I18N[lang].updated;
    document.querySelectorAll('.lang-btn').forEach((b) => b.classList.toggle('active', b.dataset.lang === lang));
    document.documentElement.lang = lang;
  }

  const nav = (navigator.language || 'en').toLowerCase().slice(0, 2);
  setLang(LANG_ORDER.includes(nav) ? nav : 'en');
</script>
