<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- SEO / social -->
  <title>Bearvil</title>
  <meta name="description" content="Bearvil — official site. Get in touch: bearvil.co@gmail.com" />
  <link rel="canonical" href="https://bearvil.github.io/" />
  <meta property="og:title" content="Bearvil" />
  <meta property="og:description" content="Bearvil — official site." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bearvil.github.io/" />
  <meta name="twitter:card" content="summary" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#fbf9f4" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231fb2ab'/%3E%3Ctext x='32' y='45' font-family='Verdana,sans-serif' font-size='38' font-weight='800' fill='%23fbf9f4' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E" />

  <!-- Fonts: preconnect + non-blocking stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />

  <!-- Styles: tokens first (single source of truth), then layers -->
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/ui.css" />
  <link rel="stylesheet" href="/assets/css/index.css" />

  <!-- Shared components: <site-nav>, <calm-sea>, email copy, font reveal -->
  <script src="/assets/components.js" defer></script>

  <!-- If JS is disabled, show content immediately -->
  <noscript><style>.content { opacity: 1; }</style></noscript>
</head>
<body class="is-fixed">

  <site-nav></site-nav>
  <calm-sea glints="24"></calm-sea>

  <main class="content" id="content" data-font-reveal>
    <div class="wordmark-block">
      <h1 class="wordmark">
        <img src="assets/Bearvil-logo-transparent.png" alt="Bearvil logo" class="site-logo" />
        <span class="gradient-text">Bearvil</span>
      </h1>
      <div class="contact">
        <span class="copied-toast" id="toast" role="status">Copied</span>
        <a id="email-link" data-copy-email href="mailto:bearvil.co@gmail.com">bearvil.co@gmail.com</a>
      </div>
    </div>
  </main>
</body>
</html>
