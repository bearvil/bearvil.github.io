<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- SEO / social -->
  <title>Contact us — Bearvil</title>
  <meta name="description" content="Get in touch with Bearvil: bearvil.co@gmail.com" />
  <link rel="canonical" href="https://bearvil.github.io/contact" />
  <meta property="og:title" content="Contact — Bearvil" />
  <meta property="og:description" content="Get in touch with Bearvil." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bearvil.github.io/contact" />
  <meta name="twitter:card" content="summary" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#fbf9f4" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" />

  <!-- Styles: tokens first (single source of truth), then layers -->
  <link rel="stylesheet" href="/assets/css/tokens.css" />
  <link rel="stylesheet" href="/assets/css/base.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/ui.css" />
  <link rel="stylesheet" href="/assets/css/patterns.css" />
  <link rel="stylesheet" href="/assets/css/contact.css" />

  <!-- Shared components: <top-nav>, <calm-sea>, email copy -->
  <script src="/assets/components.js" defer></script>
</head>
<body>

  <top-nav></top-nav>
  <calm-sea></calm-sea>

  <main class="content">
    <header class="section-head section-head--center">
      <p class="section-head__eyebrow">Contact</p>
      <h1 class="section-head__title">Let's <em>talk</em></h1>
      <p class="section-head__sub">We'd love to hear from you — questions, feedback, bug reports, anything.</p>
    </header>

    <a class="email-card" id="email-link" data-copy-email href="mailto:bearvil.co@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/>
        <path d="M3.5 6.5 L12 13 L20.5 6.5"/>
      </svg>
      <span class="address">bearvil.co@gmail.com</span>
    </a>
    <p class="hint" data-copy-hint data-copied-label="Copied to clipboard" role="status">Click to copy</p>

    <p class="contact-note">We read every message and usually reply within a couple of days. Have a quick question? Check the <a href="/about#about-faq">FAQ</a>.</p>

    <div class="contact-actions">
      <a class="btn btn--secondary" href="/">Back home</a>
    </div>
  </main>

  <site-footer></site-footer>
</body>
</html>
