<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Security -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- SEO / social -->
  <title>Contact us — Bearvil</title>
  <meta name="description" content="Get in touch with Bearvil: bearvil.co@gmail.com" />
  <link rel="canonical" href="https://bearvil.github.io/contact" />
  <meta property="og:title" content="Contact — Bearvil" />
  <meta property="og:description" content="Get in touch with Bearvil." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bearvil.github.io/contact" />
  <meta name="twitter:card" content="summary" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#07090f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307090f'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='600' fill='%237ecfff' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@300&display=block" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #4a9eff;
      --accent2: #7ecfff;
      --white: #e8f0fe;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #07090f;
    }

    :focus-visible {
      outline: 2px solid var(--accent2);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* SKY */
    .sky {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 120% 80% at 50% 110%,
        #1a3a6e 0%, #0d1f40 35%, #07090f 70%);
      animation: skyBreath 20s ease-in-out infinite alternate;
    }
    @keyframes skyBreath {
      0%   { filter: brightness(0.9); }
      100% { filter: brightness(1.1); }
    }

    /* STARS */
    .stars { position: fixed; inset: 0; pointer-events: none; }
    .star {
      position: absolute; border-radius: 50%; background: white;
      animation: twinkle var(--d) ease-in-out infinite alternate var(--dl);
    }
    @keyframes twinkle {
      0%   { opacity: 0.05; transform: scale(0.7); }
      100% { opacity: var(--o); transform: scale(1.1); }
    }

    /* MIST */
    .mist {
      position: fixed; left: -5%; width: 110%; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%, rgba(74,158,255,0.08), transparent 65%);
      filter: blur(50px); pointer-events: none;
      animation: mistMove var(--ms) ease-in-out infinite alternate;
    }
    @keyframes mistMove {
      0%   { transform: translateX(-2%) scaleX(1);    opacity: var(--mo); }
      100% { transform: translateX(2%)  scaleX(1.03); opacity: calc(var(--mo)*1.4); }
    }

    /* HORIZON */
    .horizon {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 40%;
      background: linear-gradient(0deg, rgba(74,158,255,0.12) 0%, rgba(74,158,255,0.04) 40%, transparent 100%);
      pointer-events: none;
    }

    /* CONTENT */
    .content {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      animation: fadeInUp 1.8s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes fadeInUp {
      0%   { opacity: 0; transform: translateY(16px); filter: blur(12px); }
      60%  { filter: blur(2px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0px); }
    }

    .heading {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(2rem, 8vw, 5.5rem);
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      text-transform: uppercase;
      line-height: 1;
      background: linear-gradient(135deg, #e8f0fe 0%, #7ecfff 55%, #4a9eff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 1.6rem;
      font-size: clamp(0.8rem, 1.8vw, 0.95rem);
      font-weight: 300; letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(150, 170, 200, 0.5);
    }

    /* EMAIL CARD — the single point of contact */
    .email-card {
      margin-top: 3rem;
      position: relative;
      display: flex; align-items: center; gap: 1rem;
      padding: 1.1rem 1.8rem;
      border: 1px solid rgba(126,207,255,0.22);
      border-radius: 999px;
      background: rgba(74,158,255,0.06);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      text-decoration: none;
      transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
    }
    .email-card:hover, .email-card:focus-visible {
      border-color: rgba(126,207,255,0.5);
      background: rgba(74,158,255,0.12);
      transform: translateY(-2px);
    }

    .email-card svg {
      flex: none;
      width: 20px; height: 20px;
      stroke: rgba(126,207,255,0.7);
    }

    .email-card .address {
      font-size: clamp(0.9rem, 2.4vw, 1.15rem);
      font-weight: 300; letter-spacing: 0.14em;
      color: rgba(200, 218, 240, 0.85);
      transition: color 0.3s ease;
    }
    .email-card:hover .address { color: var(--white); }

    .hint {
      margin-top: 1.1rem;
      font-size: 0.62rem; letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(150, 170, 200, 0.35);
    }

    .copied-toast {
      /* sits below the "Click to copy" hint */
      position: absolute; top: calc(100% + 3rem); left: 50%;
      transform: translateX(-50%);
      font-size: 0.62rem; letter-spacing: 0.18em;
      color: rgba(126, 207, 255, 0.8);
      opacity: 0; transition: opacity 0.3s ease;
      pointer-events: none; white-space: nowrap;
      text-transform: uppercase;
    }
    .copied-toast.show { opacity: 1; }

    /* BACK HOME — shared pill button style (same as 404) */
    .home-link {
      margin-top: 3.2rem;
      display: inline-block;
      padding: 0.8rem 2.2rem;
      border: 1px solid rgba(126,207,255,0.25);
      border-radius: 999px;
      font-size: 0.8rem; font-weight: 300; letter-spacing: 0.25em;
      text-transform: uppercase; text-decoration: none;
      color: rgba(180, 200, 230, 0.7);
      background: rgba(74,158,255,0.06);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: color 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }
    .home-link:hover, .home-link:focus-visible {
      color: var(--accent2);
      border-color: rgba(126,207,255,0.5);
      background: rgba(74,158,255,0.14);
    }

    /* NAV TOGGLE — floating circle, top-left (same as home) */
    .nav-toggle {
      position: fixed; top: 1.6rem; left: 1.6rem; z-index: 40;
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(74,158,255,0.08);
      border: 1px solid rgba(126,207,255,0.25);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    }
    .nav-toggle:hover {
      background: rgba(74,158,255,0.16);
      border-color: rgba(126,207,255,0.5);
      transform: scale(1.05);
    }
    .nav-toggle span {
      position: absolute; left: 50%; top: 50%;
      width: 20px; height: 1.6px; border-radius: 2px;
      background: var(--white);
      transform: translate(-50%, -50%);
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), opacity 0.25s ease;
    }
    .nav-toggle span:nth-child(1) { transform: translate(-50%, -7px); }
    .nav-toggle span:nth-child(3) { transform: translate(-50%, 7px); }
    body.nav-open .nav-toggle span:nth-child(1) { transform: translate(-50%, -50%) rotate(45deg); }
    body.nav-open .nav-toggle span:nth-child(2) { opacity: 0; }
    body.nav-open .nav-toggle span:nth-child(3) { transform: translate(-50%, -50%) rotate(-45deg); }

    /* SIDE NAV — hidden off-screen to the left */
    .side-nav {
      position: fixed; top: 0; left: 0; z-index: 35;
      width: min(300px, 80vw); height: 100%;
      padding: 6.5rem 2.2rem 2.2rem;
      background: rgba(7,12,24,0.78);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-right: 1px solid rgba(126,207,255,0.15);
      transform: translateX(-100%);
      visibility: hidden;
      transition: transform 0.5s cubic-bezier(0.16,1,0.3,1), visibility 0s 0.5s;
    }
    body.nav-open .side-nav {
      transform: translateX(0);
      visibility: visible;
      transition: transform 0.5s cubic-bezier(0.16,1,0.3,1), visibility 0s 0s;
    }

    .side-nav ul { list-style: none; }
    .side-nav li { margin: 0.2rem 0; }
    .side-nav a {
      display: block; padding: 0.65rem 0;
      font-size: 1rem; font-weight: 300; letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(180,200,230,0.6);
      text-decoration: none;
      transition: color 0.3s ease, padding-left 0.3s ease;
    }
    .side-nav a:hover, .side-nav a:focus-visible { color: var(--accent2); padding-left: 0.4rem; }

    /* SUBMENU — Privacy Policies */
    .sub-toggle {
      display: flex; align-items: center; gap: 0.55em;
      width: 100%; padding: 0.65rem 0;
      background: none; border: none; cursor: pointer;
      font-family: inherit;
      font-size: 1rem; font-weight: 300; letter-spacing: 0.22em;
      text-transform: uppercase; text-align: left;
      color: rgba(180,200,230,0.6);
      transition: color 0.3s ease, padding-left 0.3s ease;
    }
    .sub-toggle:hover, .sub-toggle:focus-visible { color: var(--accent2); padding-left: 0.4rem; }
    .sub-toggle .chev {
      flex: none;
      transition: transform 0.35s cubic-bezier(0.16,1,0.3,1);
    }
    .has-sub.open .sub-toggle .chev { transform: rotate(180deg); }

    .sub-menu {
      list-style: none; overflow: hidden;
      max-height: 0; opacity: 0;
      transition: max-height 0.45s cubic-bezier(0.16,1,0.3,1), opacity 0.35s ease;
    }
    .has-sub.open .sub-menu { max-height: 8rem; opacity: 1; }
    .sub-menu li { margin: 0; }
    .sub-menu a {
      padding: 0.45rem 0 0.45rem 1.3rem;
      font-size: 0.82rem;
      color: rgba(180,200,230,0.45);
      border-left: 1px solid rgba(126,207,255,0.18);
    }
    .sub-menu a:hover, .sub-menu a:focus-visible { padding-left: 1.7rem; }

    /* OVERLAY — dims page when nav open */
    .nav-overlay {
      position: fixed; inset: 0; z-index: 30;
      background: rgba(3,6,14,0.5);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    body.nav-open .nav-overlay { opacity: 1; pointer-events: auto; }

    /* ACCESSIBILITY — reduced motion: stop only continuous background drift */
    @media (prefers-reduced-motion: reduce) {
      .star { animation: none; opacity: var(--o); }
      .sky { animation: none; }
      .mist { animation: none; opacity: var(--mo); }
    }
  </style>
</head>
<body>

  <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="side-nav">
    <span></span><span></span><span></span>
  </button>

  <nav class="side-nav" id="side-nav" aria-label="Main navigation">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/work">Work</a></li>
      <li><a href="/about">About</a></li>
      <li><a href="/contact">Contact</a></li>
      <li class="has-sub">
        <button class="sub-toggle" id="privacy-toggle" aria-expanded="false" aria-controls="privacy-sub">
          Privacy Policies
          <svg class="chev" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="sub-menu" id="privacy-sub">
          <li><a href="/privacy-policies/touchy-fingies-pp" target="_blank" rel="noopener">Touchy Fingies</a></li>
          <li><a href="/privacy-policies/frend-ai-pp" target="_blank" rel="noopener">Frend AI</a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>

  <div class="sky" aria-hidden="true"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="mist" style="top:55%;height:180px;--ms:16s;--mo:0.7;" aria-hidden="true"></div>
  <div class="mist" style="top:72%;height:120px;--ms:21s;--mo:0.45;animation-direction:alternate-reverse;" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>

  <main class="content">
    <h1 class="heading">Contact us</h1>
    <p class="tagline">We'd love to hear from you</p>

    <a class="email-card" id="email-link" href="mailto:bearvil.co@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/>
        <path d="M3.5 6.5 L12 13 L20.5 6.5"/>
      </svg>
      <span class="address">bearvil.co@gmail.com</span>
      <span class="copied-toast" id="toast" role="status">Copied to clipboard</span>
    </a>
    <p class="hint">Click to copy</p>

    <a class="home-link" href="/">Back home</a>
  </main>

  <script>
    'use strict';

    // Stars — single DOM write, fewer on small screens
    const starsEl = document.getElementById('stars');
    const starCount = window.matchMedia('(max-width: 600px)').matches ? 60 : 110;
    let html = '';
    for (let i = 0; i < starCount; i++) {
      const sz = (Math.random() * 2 + 0.4).toFixed(2);
      html += `<div class="star" style="width:${sz}px;height:${sz}px;left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*70).toFixed(2)}%;--d:${(Math.random()*4+2).toFixed(1)}s;--dl:-${(Math.random()*6).toFixed(1)}s;--o:${(Math.random()*0.6+0.2).toFixed(2)};"></div>`;
    }
    starsEl.innerHTML = html;

    // Side nav toggle (same as home)
    const navToggle = document.getElementById('nav-toggle');
    const navOverlay = document.getElementById('nav-overlay');
    function closeNav(returnFocus) {
      if (!document.body.classList.contains('nav-open')) return;
      document.body.classList.remove('nav-open');
      navToggle.setAttribute('aria-expanded', 'false');
      const sub = document.querySelector('.has-sub.open');
      if (sub) {
        sub.classList.remove('open');
        sub.querySelector('.sub-toggle').setAttribute('aria-expanded', 'false');
      }
      if (returnFocus) navToggle.focus();
    }
    navToggle.addEventListener('click', () => {
      const open = document.body.classList.toggle('nav-open');
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) {
        const first = document.querySelector('.side-nav a');
        if (first) first.focus();
      }
    });
    navOverlay.addEventListener('click', () => closeNav(false));

    // Privacy Policies submenu
    const privacyToggle = document.getElementById('privacy-toggle');
    privacyToggle.addEventListener('click', () => {
      const open = privacyToggle.parentElement.classList.toggle('open');
      privacyToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    document.querySelectorAll('.side-nav a').forEach(a => a.addEventListener('click', () => closeNav(false)));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNav(true); });

    // Email copy — with fallback to mailto if Clipboard API unavailable
    document.getElementById('email-link').addEventListener('click', function (e) {
      if (!navigator.clipboard || !window.isSecureContext) return; // let mailto work
      e.preventDefault();
      navigator.clipboard.writeText('bearvil.co@gmail.com').then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1800);
      }).catch(() => {
        window.location.href = 'mailto:bearvil.co@gmail.com';
      });
    });
  </script>
</body>
</html>
